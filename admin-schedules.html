<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 일정 관리 | Shadowing Player Pro</title><style>body{font:15px system-ui,sans-serif;background:#f4f7fb;color:#19283e;margin:0}header{background:#172d4a;color:#fff;padding:20px max(16px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:20px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce4ef;border-radius:12px;padding:20px;margin:14px 0}h2{margin:0 0 15px;font-size:19px}label{display:block;margin:10px 0 5px;font-weight:600}input,select,button{font:inherit;padding:9px;border:1px solid #bccbdd;border-radius:7px}input,select{width:100%;box-sizing:border-box}button{background:#1763c9;color:white;border:0;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}button.secondary{background:#e7eef8;color:#16365b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.check{display:block;font-weight:400;padding:6px;border-bottom:1px solid #edf1f7}.check input{width:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #e5ebf3}small{color:#5b6d85}#message{white-space:pre-wrap;background:#eaf1fc;padding:10px;border-radius:6px}a{color:#1763c9}</style></head><body><header><h1>학습 일정 관리</h1><div>Shadowing Player Pro · 관리자 전용</div></header><main><p><a href="/admin.html">← Admin Dashboard</a></p><section class="panel"><h2>관리자 인증</h2><label for="token">ADMIN_API_TOKEN (현재 탭 메모리에만 보관)</label><input id="token" type="password" autocomplete="off"><button id="login">인증 및 데이터 조회</button><button id="logout" class="secondary">로그아웃</button><div id="message" role="status">인증이 필요합니다.</div></section><section class="panel"><h2>새 학습 일정 만들기</h2><small>먼저 콘텐츠 관리에서 콘텐츠를 published로 변경하세요. 신규 일정은 안전하게 비활성 상태로 생성됩니다.</small><div class="grid"><div><label>일정 이름</label><input id="name" placeholder="주간 영어 학습"></div><div><label>시작일 (한국시간 기준)</label><input id="start" type="date"></div><div><label>반복 방식</label><select id="mode"><option value="rotation">Rotation · 매일 변경</option><option value="weekly">Weekly · 7일마다 변경</option><option value="interval">Interval · 지정 일수마다 변경</option></select></div><div><label>변경 간격 (Interval 전용)</label><input id="interval" type="number" min="1" max="365" value="7"></div></div><label>콘텐츠 선택 및 순서</label><div id="choices">인증 후 표시됩니다.</div><button id="create">비활성 일정 생성</button></section><section class="panel"><h2>등록된 일정</h2><div id="schedules">인증 후 표시됩니다.</div></section><section class="panel"><h2>추천 일정 미리보기</h2><div class="grid"><div><label>일정</label><select id="previewId"></select></div><div><label>미리보기 시작일</label><input type="date" id="previewStart"></div><div><label>기간</label><select id="days"><option value="7">7일</option><option value="30">30일</option></select></div></div><button id="preview">미리보기</button><small>미리보기는 기록을 생성하지 않습니다. 이미 확정된 이력이 있으면 해당 결과를 우선 표시합니다.</small><div id="results"></div></section></main><script>
(()=>{'use strict';let token='',contents=[],schedules=[];const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('start').value=today;$('previewStart').value=today;
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'X-Admin-Request':'1',...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});let body;try{body=await r.json()}catch{throw Error('HTTP '+r.status)}if(!r.ok||body.ok===false)throw Error(body.error||'HTTP '+r.status);return body}
async function refresh(){const [c,s]=await Promise.all([api('/api/admin-contents'),api('/api/admin-schedules')]);contents=c.contents||[];schedules=s.schedules||[];render();msg('인증 완료 · 일정 '+schedules.length+'개');}
function render(){ $('choices').innerHTML=contents.filter(x=>x.status==='published').map(x=>`<label class="check"><input type="checkbox" class="item" value="${esc(x.id)}"> ${esc(x.title)} <small>${esc(x.id)}</small></label>`).join('')||'<small>발행된 콘텐츠가 없습니다. 콘텐츠 관리에서 먼저 published로 변경하세요.</small>';
$('schedules').innerHTML=schedules.length?`<table><thead><tr><th>이름</th><th>방식</th><th>시작일</th><th>콘텐츠</th><th>상태</th><th>작업</th></tr></thead><tbody>${schedules.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.mode)}</td><td>${esc(s.start_date)}</td><td>${(s.items||[]).map(x=>esc(x.title)).join(' → ')}</td><td>${s.enabled?'활성':'비활성'}</td><td><button class="secondary toggle" data-id="${s.id}" data-on="${s.enabled?'0':'1'}">${s.enabled?'비활성화':'활성화'}</button></td></tr>`).join('')}</tbody></table>`:'<small>등록된 일정이 없습니다.</small>';
$('previewId').innerHTML=schedules.map(s=>`<option value="${s.id}">${esc(s.name)} (#${s.id})</option>`).join('');}
document.querySelector('section.panel').style.display='none';fetch('/api/admin-session',{cache:'no-store'}).then(r=>{if(!r.ok){location.replace('/admin.html');return;}refresh().catch(e=>msg(e.message));}).catch(()=>location.replace('/admin.html'));$('login').onclick=async()=>{token=$('token').value.trim();$('token').value='';try{await refresh()}catch(e){token='';msg('인증/조회 실패: '+e.message)}};$('logout').onclick=()=>{token='';contents=[];schedules=[];render();$('results').textContent='';msg('로그아웃 완료')};
$('create').onclick=async()=>{const ids=[...document.querySelectorAll('.item:checked')].map(x=>x.value);if(!ids.length)return msg('콘텐츠를 하나 이상 선택하세요');try{const r=await api('/api/admin-schedules','POST',{name:$('name').value,mode:$('mode').value,start_date:$('start').value,interval_days:Number($('interval').value),content_ids:ids});await refresh();msg('일정 #'+r.id+' 생성 완료 (비활성)')}catch(e){msg('생성 실패: '+e.message)}};
$('schedules').onclick=async e=>{const b=e.target.closest('button.toggle');if(!b)return;const id=Number(b.dataset.id),enabled=b.dataset.on==='1';if(!confirm('일정 #'+id+'을 '+(enabled?'활성화':'비활성화')+'할까요?'))return;try{await api('/api/admin-schedules','PATCH',{id,enabled});await refresh()}catch(err){msg('변경 실패: '+err.message)}};
$('preview').onclick=async()=>{try{const id=$('previewId').value;if(!id)throw Error('일정을 먼저 생성하세요');const q=new URLSearchParams({preview:id,days:$('days').value,start:$('previewStart').value});const r=await api('/api/admin-schedules?'+q);$('results').innerHTML=`<table><thead><tr><th>날짜</th><th>콘텐츠</th><th>선정 방식</th><th>Guide 버전</th></tr></thead><tbody>${r.preview.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title||'미선정')}</td><td>${esc(x.source)}</td><td>${esc(x.guide_version??'-')}</td></tr>`).join('')}</tbody></table>`;msg('미리보기 완료')}catch(e){msg('미리보기 실패: '+e.message)}};
})();</script></body></html>
