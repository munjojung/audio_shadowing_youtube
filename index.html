<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowing Player Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans KR"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 9999px;
            background: #e2e8f0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            margin-top: -5px;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.4);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        /* Recording Pulse Animation */
        @keyframes pulse-rec {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .rec-active {
            animation: pulse-rec 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-6 px-4 selection:bg-blue-600 selection:text-white">

    <!-- Main Container -->
    <div class="w-full max-w-4xl flex flex-col gap-4">

        <!-- 1. Top Compact File Loader Bar (KO/EN VTT buttons removed, only MP3 bundle button) -->
        <header class="bg-white border border-slate-200/90 rounded-2xl px-4 py-3 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm">
                    <i data-lucide="headphones" class="w-4 h-4"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-tight text-slate-800">Shadowing Player <span class="text-blue-600">Pro</span></span>
                    <div id="loadedAudioName" class="text-xs text-slate-400 truncate max-w-[200px] sm:max-w-[320px]">MP3 파일을 선택하세요.</div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="pairStatus" class="text-xs text-slate-500 hidden sm:inline">GitHub 자동 연결 준비됨</span>
                <!-- MP3 button stays first; interface language uses one toggle button. -->
                <button type="button" id="btnOpenLocalFiles" class="cursor-pointer inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm transition active:scale-95">
                    <i data-lucide="music" class="w-3.5 h-3.5"></i>
                    <span id="audioLabelText">MP3 열기</span>
                </button>
                <button type="button" id="uiLanguageToggle" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-200 transition shrink-0" aria-label="Switch interface language to English" title="Switch interface language to English">
                    <span id="uiLanguageToggleLabel">English</span>
                </button>
                <input type="file" id="bundleFiles" accept=".mp3,.wav,.m4a,.ogg,.vtt,audio/*,text/vtt" multiple class="hidden">
            </div>
        </header>

        <!-- 2. Top Subtitle Display Card -->
        <section id="realtimeSubtitleCard" class="bg-white border border-slate-200/90 rounded-2xl p-5 shadow-sm flex flex-col gap-3">
            <!-- Header Row -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-500">
                    <span class="px-1.5 py-0.5 rounded bg-blue-600 text-white text-[10px] font-extrabold tracking-wider">CC</span>
                    <span id="cueTime" class="font-mono text-slate-600">00:00.00</span>
                </div>
                <!-- Segmented Toggle Button [KO | EN] -->
                <div class="inline-flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200/60">
                    <button type="button" id="btnLangKo" class="px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm transition">KO</button>
                    <button type="button" id="btnLangEn" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">EN</button>
                </div>
            </div>

            <!-- Subtitle Row -->
            <div class="min-h-[50px] flex items-center">
                <p id="currentSubtitleText" class="text-base sm:text-lg font-bold text-slate-800 leading-snug break-words">
                    오디오를 불러오세요.
                </p>
            </div>
        </section>

        <!-- 3. Main Audio Control Bar Card -->
        <section class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm flex flex-col gap-3">
            <!-- Top Row: Time & Shortcuts -->
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="font-mono font-semibold text-slate-600">
                    <span id="currentTimeDisplay" class="text-slate-900">00:00</span>
                    <span class="text-slate-400 mx-0.5">/</span>
                    <span id="durationDisplay">00:00</span>
                </div>
                <div class="text-[11px] font-medium text-blue-600">
                    Space: 재생/일시정지 | A/B: 구간설정 | ←/→: 3초 이동
                </div>
            </div>

            <!-- Seek Bar -->
            <div class="relative w-full flex items-center">
                <input type="range" id="seekBar" min="0" max="100" step="0.01" value="0" class="w-full">
            </div>

            <!-- Bottom Control Row -->
            <div class="flex flex-wrap items-center gap-2 pt-1">
                <!-- Skip Backward 3s -->
                <button type="button" id="btnSkipBack" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition active:scale-95" title="3초 뒤로 (←)">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>

                <!-- Play / Pause -->
                <button type="button" id="btnPlayPause" class="w-12 h-12 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white shadow-md shadow-blue-500/25 flex items-center justify-center transition active:scale-95" title="재생 / 일시정지 (Space)">

                        <button type="button" id="btnNudgeBMinus" class="px-2.5 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-mono text-xs font-semibold transition">-0.1s</button>

        <!-- Optional Study Guide; content metadata is independent of MP3 and VTT -->
        <section id="panelGuide" class="hidden bg-white border border-amber-200 rounded-2xl p-4 shadow-sm flex flex-col gap-3" aria-label="Study Guide">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2 text-xs font-bold text-amber-700">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    <span id="guideHeading">학습 가이드</span>
                </div>
                <span id="guideCount" class="text-xs text-slate-500"></span>
            </div>
            <p id="guideDescription" class="text-xs text-slate-600 leading-relaxed"></p>
            <div id="guideSections" class="flex flex-col gap-2"></div>
            <button type="button" id="guideReviewBtn" class="hidden self-start px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-semibold"></button>

    <!-- Toast Notification Banner -->
    <div id="toastBanner" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 bg-slate-800 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-blue-400"></i>
        <span id="toastText">알림</span>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="mainAudio" preload="metadata"></audio>
    <audio id="recordedAudio" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }

            const OWNER = "munjojung";
            const REPO = "audio_shadowing_youtube";
            const BRANCH = "main";

            // ==========================================
            // Helper Functions
            // ==========================================
            function parseTimestamp(value) {
                const match = String(value).trim().replace(',', '.').match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);
                if (!match) return NaN;
                const h = Number(match[1] || 0), m = Number(match[2]), sec = Number(match[3]);
                if (m >= 60 && match[1] || sec >= 60) return NaN;
                return h * 3600 + m * 60 + sec + Number((match[4] || '0').padEnd(3, '0')) / 1000;
            }

            function parseVTT(vttText) {
                if (!vttText) return [];
                const text = String(vttText).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
                const cues = [];
                for (const block of text.split(/\n\s*\n/)) {
                    const lines = block.trim().split('\n');
                    if (/^(WEBVTT|NOTE|STYLE|REGION)(?:\s|$)/i.test(lines[0] || '')) continue;
                    const index = lines.findIndex(line => line.includes('-->'));
                    if (index < 0) continue;
                    const match = lines[index].match(/(\S+)\s+-->\s+(\S+)/);
                    if (!match) continue;
                    const start = parseTimestamp(match[1]), end = parseTimestamp(match[2]);
                    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) continue;
                    const content = lines.slice(index + 1).join(' ').replace(/<[^>]*>/g, '').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/^\s*(?:>>|>)+\s*/, '').trim();
                    if (content) cues.push({start, end, text: content});
                }
                return cues.sort((a, b) => a.start - b.start);
            }

            function formatTime(seconds, includeMs = false) {
                if (isNaN(seconds) || seconds < 0) return includeMs ? "00:00.00" : "00:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                const pad = (n) => String(n).padStart(2, '0');
                if (includeMs) {
                    const ms = Math.floor((seconds % 1) * 100);
                    return `${pad(mins)}:${pad(secs)}.${String(ms).padStart(2, '0')}`;
                }
                return `${pad(mins)}:${pad(secs)}`;
            }

            function message(text) {
                const noticeEl = document.getElementById('notice');
                if (noticeEl) noticeEl.textContent = text;
                if (!noticeEl && /연결 실패|검색 오류|처리 오류/.test(text)) {
                    console.warn("Shadowing Player subtitle diagnostics:", text);
                    showToast("자막 연결 실패: 개발자 도구(F12) Console에서 상세 오류를 확인하세요.");
                }
            }

            let toastTimer = null;
            function showToast(msg) {
                const banner = document.getElementById('toastBanner');
                const textEl = document.getElementById('toastText');
                if (!banner || !textEl) return;
                textEl.textContent = msg;
                banner.classList.remove('translate-y-20', 'opacity-0');
                banner.classList.add('translate-y-0', 'opacity-100');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {

                    banner.classList.add('translate-y-20', 'opacity-0');

            function videoId(base) {
                return base.match(/_([A-Za-z0-9_-]{11})$/)?.[1] || "";
            }

            function rawUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encoded}`;
            }

            function cdnUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/${encoded}`;
            }

            function apiUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encoded}?ref=${BRANCH}`;
            }

            async function downloadVTT(path) {
                const urls = [rawUrl(path), cdnUrl(path), apiUrl(path)];
                const errors = [];

                for (const url of urls) {
                    try {
                        const response = await fetch(url, { cache: "no-store" });
                        if (!response.ok) {
                            errors.push(`HTTP ${response.status}: ${url}`);
                            continue;
                        }

                        let text = await response.text();

                        if (url.includes("api.github.com") && text.trimStart().startsWith("{")) {
                            const json = JSON.parse(text);
                            if (json.encoding === "base64" && json.content) {
                                const bytes = Uint8Array.from(
                                    atob(json.content.replace(/\s/g, "")),
                                    c => c.charCodeAt(0)
                                );
                                text = new TextDecoder("utf-8").decode(bytes);
                            }
                        }

                        const cues = parseVTT(text);
                        if (cues.length) return { cues, url, errors: [] };
                        errors.push(`VTT 문장 없음: ${url}`);
                    } catch (error) {
                        errors.push(`${error.message}: ${url}`);
                    }
                }

                return { cues: [], url: null, errors };
            }

            async function repositoryPaths() {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
                const response = await fetch(url, { cache: "no-store" });
                if (!response.ok) throw Error(`GitHub 목록 조회 HTTP ${response.status}`);
                const json = await response.json();
                if (json.truncated) throw Error("GitHub 파일 목록이 잘렸습니다.");
                return (json.tree || []).filter(item => item.type === "blob" && item.path).map(item => item.path);
            }

            let treePromise = null;
            function getTree() {
                if (!treePromise) {
                    treePromise = repositoryPaths().catch(error => {
                        treePromise = null;
                        throw error;
                    });
                }
                return treePromise;
            }

            async function findSubtitle(base, lang) {
                const name = `${base}_${lang}.vtt`;
                const id = videoId(base);
                const errors = [];
                const tried = new Set();
                async function attempt(path) {
                    if (tried.has(path)) return null;
                    tried.add(path);
                    const result = await downloadVTT(path);
                    if (result.cues.length) return result;
                    errors.push(...result.errors);
                    return null;
                }
                // Primary layout confirmed by user: repo / YouTube-ID / filename_language.vtt
                if (id) {
                    const result = await attempt(`${id}/${name}`);
                    if (result) return result;
                }
                // Repository-wide fallback only if primary path fails.
                try {
                    const paths = await getTree();
                    const target = name.toLowerCase();
                    const exact = paths.filter(path => path.split('/').pop().toLowerCase() === target);
                    const candidates = exact.length ? exact : paths.filter(path => {
                        const filename = path.split('/').pop().toLowerCase();
                        return filename.endsWith(`_${lang}.vtt`) && id && path.toLowerCase().includes(id.toLowerCase());
                    });
                    for (const path of candidates) {
                        const result = await attempt(path);
                        if (result) return result;
                    }
                    if (!candidates.length) errors.push(`GitHub 파일 목록에서 ${name}을 찾지 못했습니다.`);
                } catch (error) {
                    errors.push(`GitHub 전체 검색 실패: ${error.message}`);
                }
                if (!id) {
                    const result = await attempt(name);
                    if (result) return result;
                }
                return { cues: [], url: null, errors };
            }

            function renderSubtitleForTime(currentTime) {
                if (!el.currentSubtitleText) return;
                const list = state.subtitles[state.currentLang] || [];

                if (list.length === 0) {
                    const otherLang = state.currentLang === 'ko' ? 'en' : 'ko';
                    const msg = (state.subtitles[otherLang] || []).length > 0
                        ? (state.currentLang === 'ko' ? '한국어(KO) VTT 자막이 없습니다.' : 'English (EN) VTT file is not available.')
                        : '오디오를 불러오세요.';
                    
                    el.currentSubtitleText.textContent = msg;
                    if (el.cueTime) el.cueTime.textContent = formatTime(currentTime, true);
                    state.activeCueIndex = -1;
                    return;
                }

                let matchedIdx = -1;
                for (let i = 0; i < list.length; i++) {
                    if (currentTime >= list[i].start && currentTime < list[i].end) {
                        matchedIdx = i;
                        break;
                    }
                }

                if (matchedIdx === -1) {
                    for (let i = list.length - 1; i >= 0; i--) {
                        if (currentTime >= list[i].start) {
                            matchedIdx = i;
                            break;
                        }
                    }
                }

                if (matchedIdx === -1 && list.length > 0) {
                    matchedIdx = 0;
                }

                state.activeCueIndex = matchedIdx;
                if (matchedIdx >= 0 && list[matchedIdx]) {
                    const cue = list[matchedIdx];
                    el.currentSubtitleText.textContent = cue.text;
                    if (el.cueTime) {
                        el.cueTime.textContent = `${formatTime(cue.start, true)} ~ ${formatTime(cue.end, true)}`;
                    }
                }
            }

            // 폴더 접근이 허용된 브라우저에서만 같은 폴더의 자막을 읽습니다.
            // 일반 file input은 선택되지 않은 형제 파일을 읽을 권한이 없습니다.
            let authorizedSubtitleFolder = null;
            async function subtitleFilesFromFolder(mp3File, selectedFiles) {
                const base = mp3File.name.replace(/\.[^.]+$/, '');
                const missing = ['ko', 'en'].filter(lang =>
                    !selectedFiles.some(file => file.name.toLowerCase() === `${base}_${lang}.vtt`.toLowerCase())
                );
                if (!missing.length) return selectedFiles;
                if (typeof window.showDirectoryPicker !== 'function' || !window.isSecureContext) return selectedFiles;

                let folder = authorizedSubtitleFolder;
                if (folder) {
                    try {
                        if (await folder.queryPermission({ mode: 'read' }) !== 'granted') folder = null;
                    } catch (_) { folder = null; }
                }
                if (!folder) {
                    try {
                        // 명시적 폴더 권한 부여: OS/브라우저에 따라 두 번째 선택창이 열립니다.
                        folder = await window.showDirectoryPicker({ startIn: 'downloads', mode: 'read' });
                        authorizedSubtitleFolder = folder;
                    } catch (error) {
                        if (error.name !== 'AbortError') console.info('폴더 접근 미지원 또는 거부, GitHub 검색으로 전환:', error);
                        return selectedFiles;
                    }
                }
                const found = [...selectedFiles];
                for (const lang of missing) {
                    const filename = `${base}_${lang}.vtt`;
                    try {
                        const handle = await folder.getFileHandle(filename);
                        found.push(await handle.getFile());
                    } catch (error) {
                        console.info('선택 폴더에서 자막을 찾지 못함:', filename, error.name);
                    }
                }
                return found;
            }

            async function loadFiles(fileList) {
                const files = Array.from(fileList || []);
                const mp3File = files.find(f => /\.(mp3|wav|m4a|ogg)$/i.test(f.name) || f.type.startsWith("audio/"));

                if (!mp3File) {
                    message("MP3 오디오 파일을 선택하세요.");
                    return;
                }

                resetAudioState();
                const token = state.loadId;
                // 모바일 파일 선택창은 선택한 파일만 읽을 수 있습니다.
                // 선택된 자막을 우선 사용하고, 누락된 자막은 GitHub에서 검색합니다.
                const pairedFiles = files;

                if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
                state.objectUrl = URL.createObjectURL(mp3File);
                if (el.mainAudio) {
                    el.mainAudio.src = state.objectUrl;
                    el.mainAudio.load();
                    el.mainAudio.currentTime = 0;
                    // 모바일 자동재생 정책: 파일 선택 후 재생 버튼으로 시작합니다.
                }

                if (el.loadedAudioName) el.loadedAudioName.textContent = mp3File.name;
                if (el.audioLabelText) el.audioLabelText.textContent = 'MP3 변경';

                const base = mp3File.name.replace(/\.[^.]+$/, "");

                if (el.pairStatus) el.pairStatus.textContent = "한국어·영어 자막 검색 중…";

                const results = await Promise.all(
                    ["ko", "en"].map(async lang => {
                        const name = `${base}_${lang}.vtt`.toLowerCase();
                        const local = pairedFiles.find(f => f.name.toLowerCase() === name);
                        if (local) {
                            try {
                                const text = await local.text();
                                const cues = parseVTT(text);
                                if (cues.length) return { cues, url: "로컬 파일", errors: [] };
                            } catch(e) {}
                        }
                        return findSubtitle(base, lang);
                    })
                );

                if (token !== state.loadId) return;

                state.subtitles.ko = results[0].cues;
                state.subtitles.en = results[1].cues;

                if (el.pairStatus) {
                    el.pairStatus.textContent = `자동 자막 연결: ${state.subtitles.ko.length ? "KO ✓" : "KO 없음"} · ${state.subtitles.en.length ? "EN ✓" : "EN 없음"}`;
                }

                if (state.subtitles.ko.length > 0) {
                    setLanguage('ko');
                } else if (state.subtitles.en.length > 0) {
                    setLanguage('en');
                } else {
                    renderSubtitleForTime(0);

                }

                const success = results.map((res, i) => `${i === 0 ? "KO" : "EN"}: ${res.cues.length ? `${res.cues.length}문장 연결 (${res.url})` : "연결 실패"}`);
                const errors = results.flatMap(res => res.errors || []);
                const detail = success.join("\n") + (errors.length ? "\n검색 오류:\n" + errors.slice(0, 8).join("\n") : "");
                console.info("Shadowing Player subtitle result:", detail);
                message(detail);
                if (results.every(res => !res.cues.length)) showToast("자막 연결 실패: MP3와 KO/EN VTT를 함께 선택하거나 GitHub 접근을 확인하세요.");
            }

            // 파일 선택창의 폴더 위치는 웹페이지가 강제로 지정할 수 없습니다.

            // GitHub 저장소의 실제 MP3 목록을 자동 수집해 날짜별 순환 추천합니다.
            // UI 변경 없음. 저장소에 MP3를 추가하면 다음 접속 시 목록에 반영됩니다.
            const FALLBACK_CONTENT = {
                folder: 'TSIgstxOCwY',
                base: 'be_in_a_funk_be_bummed_out_TSIgstxOCwY',
                title: 'Be in a funk / Be bummed out'
            };
            const koreaDate = () => new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
            let recommendedContent = FALLBACK_CONTENT;
            let sampleFallbackUsed = false;
            let dailyCatalog = [];

            async function discoverDailyCatalog() {
                const paths = await getTree();
                const mp3s = paths.filter(path => /\.mp3$/i.test(path));
                const entries = mp3s.map(path => {
                    const base = path.split('/').pop().replace(/\.mp3$/i, '');
                    const folder = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
                    const stem = path.replace(/\.mp3$/i, '');
                    const id = videoId(base);
                    const hasKO = paths.some(p => p.toLowerCase() === (stem + '_ko.vtt').toLowerCase())
                        || paths.some(p => id && p.toLowerCase().endsWith('_ko.vtt') && p.includes(id));
                    const hasEN = paths.some(p => p.toLowerCase() === (stem + '_en.vtt').toLowerCase())
                        || paths.some(p => id && p.toLowerCase().endsWith('_en.vtt') && p.includes(id));
                    return { folder, base, title: base.replace(/_[A-Za-z0-9_-]{11}$/, '').replace(/_/g, ' '),
                        hasKO, hasEN, path };
                });
                // 자막이 있는 MP3 우선. 없는 파일도 재생 가능하도록 목록에 포함.
                return entries.sort((a,b) =>
                    (Number(b.hasKO) + Number(b.hasEN)) - (Number(a.hasKO) + Number(a.hasEN))
                    || a.path.localeCompare(b.path));
            }

            function selectDailyRecommendation(catalog, day) {
                if (!catalog.length) return FALLBACK_CONTENT;
                const epochDay = Math.floor(Date.parse(day + 'T00:00:00Z') / 86400000);
                return catalog[epochDay % catalog.length];
            }

            async function loadRecommendedContent(content) {
                // 사용자가 로컬 파일을 선택했다면 비동기 추천 로딩이 덮어쓰지 않도록 합니다.
                resetAudioState();
                const token = state.loadId;
                recommendedContent = content;
                sampleFallbackUsed = false;
                const mp3Name = `${content.base}.mp3`;
                const path = content.folder ? `${content.folder}/${mp3Name}` : mp3Name;
                if (el.mainAudio) {
                    el.mainAudio.src = rawUrl(path);
                    el.mainAudio.load();
                }
                if (el.loadedAudioName) el.loadedAudioName.textContent = `${mp3Name} (오늘의 추천)`;
                if (el.pairStatus) el.pairStatus.textContent = '추천 콘텐츠 자막 연결 중…';
                const results = await Promise.all(['ko','en'].map(lang => findSubtitle(content.base, lang)));
                if (token !== state.loadId) return;
                state.subtitles.ko = results[0].cues;
                state.subtitles.en = results[1].cues;
                if (el.pairStatus) el.pairStatus.textContent = `오늘의 추천: KO ${results[0].cues.length ? '✓':'없음'} · EN ${results[1].cues.length ? '✓':'없음'}`;
                setLanguage(results[0].cues.length ? 'ko' : 'en');
                document.dispatchEvent(new Event('shadowing:recommended-loaded'));
            }

            // Cloudflare R2: 기존 UI/로컬 파일 선택 기능은 그대로 유지합니다.
            // 공개 학습 콘텐츠만 허용하는 Vercel API에서 단기 서명 URL을 받습니다.
            async function loadR2Content(contentId) {
                if (!/^[A-Za-z0-9_-]{11}$/.test(contentId)) throw new Error('잘못된 콘텐츠 ID');
                resetAudioState();
                const token = state.loadId;
                const kinds = ['audio', 'ko', 'en'];
                const results = await Promise.all(kinds.map(async type => {
                    const response = await fetch(`/api/content-url?id=${encodeURIComponent(contentId)}&type=${type}`, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`R2 URL 요청 실패 (${type}: ${response.status})`);
                    const payload = await response.json();
                    return payload.url;
                }));
                if (token !== state.loadId) return;
                const vtts = await Promise.all(results.slice(1).map(async url => {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`VTT 다운로드 실패 (${response.status})`);
                    return parseVTT(await response.text());
                }));
                if (token !== state.loadId) return;
                state.subtitles.ko = vtts[0];
                state.subtitles.en = vtts[1];
                recommendedContent = { folder: `contents/${contentId}`, base: contentId, title: contentId, source: 'r2' };
                sampleFallbackUsed = true;
                if (el.mainAudio) {
                    el.mainAudio.src = results[0];
                    el.mainAudio.load();
                }
                if (el.loadedAudioName) el.loadedAudioName.textContent = `${contentId} (R2)`;
                if (el.pairStatus) el.pairStatus.textContent = `R2 자막: KO ${vtts[0].length ? '✓' : '없음'} · EN ${vtts[1].length ? '✓' : '없음'}`;
                setLanguage(vtts[0].length ? 'ko' : 'en');
                document.dispatchEvent(new Event('shadowing:recommended-loaded'));
            }

            // V2: published R2 catalog; no HTML UI changes.
            async function fetchR2Catalog() {
                const response = await fetch('/api/contents', { cache: 'no-store' });
                if (!response.ok) throw new Error(`콘텐츠 목록 조회 HTTP ${response.status}`);
                const payload = await response.json();
                if (!Array.isArray(payload.contents)) throw new Error('잘못된 콘텐츠 목록');
                return payload.contents.filter(item => /^[A-Za-z0-9_-]{11}$/.test(item.id));
            }
            const initialLoadId = state.loadId;
            (async () => {
                const requestedId = new URLSearchParams(location.search).get('content');
                let published = [];
                try {
                    published = await fetchR2Catalog();
                    dailyCatalog = published.map(item => ({ ...item, folder: `contents/${item.id}`, base: item.id, source: 'r2' }));
                    if (state.loadId !== initialLoadId) return;
                    if (published.length) {
                        const selected = requestedId
                            ? published.find(item => item.id === requestedId)
                            : selectDailyRecommendation(published, koreaDate());
                        if (!selected) throw new Error('등록되지 않은 콘텐츠 ID');
                        await loadR2Content(selected.id);
                        if (state.loadId !== initialLoadId + 1) return;
                        recommendedContent.title = selected.title;
                        if (el.loadedAudioName) el.loadedAudioName.textContent = `${selected.title} (R2)`;
                        return;
                    }
                } catch (error) {
                    console.warn('[R2] 콘텐츠 목록/재생 실패:', error);
                    if (state.loadId !== initialLoadId && state.loadId !== initialLoadId + 1) return;
                    if (requestedId && published.length) {
                        showToast('지정한 콘텐츠를 불러오지 못했습니다.');
                        return;
                    }
                }
                // Existing GitHub fallback for first-run/offline API errors.
                const fallbackToken = state.loadId;
                try {
                    const githubCatalog = await discoverDailyCatalog();
                    if (state.loadId !== fallbackToken) return;
                    dailyCatalog = githubCatalog;
                } catch (error) {
                    console.warn('[Daily 10] GitHub 목록 조회 실패:', error);
                }
                if (state.loadId !== fallbackToken) return;
                await loadRecommendedContent(selectDailyRecommendation(dailyCatalog, koreaDate()));
            })().catch(error => {
                console.error('[Daily 10] 콘텐츠 로딩 실패:', error);
                showToast('콘텐츠를 불러오지 못했습니다. MP3 열기로 자유 학습할 수 있습니다.');
            });
            el.mainAudio?.addEventListener('error', () => {
                if (state.objectUrl || !recommendedContent || recommendedContent.source === 'r2') return;
                const path = recommendedContent.folder
                    ? `${recommendedContent.folder}/${recommendedContent.base}.mp3`
                    : `${recommendedContent.base}.mp3`;
                if (!el.mainAudio.src.includes(encodeURIComponent(recommendedContent.base))) return;
                if (!sampleFallbackUsed) {
                    sampleFallbackUsed = true;
                    el.mainAudio.src = cdnUrl(path);
                    el.mainAudio.load();
                } else {
                    showToast('추천 MP3를 불러오지 못했습니다. GitHub 파일 경로를 확인하세요.');
                    if (el.pairStatus) el.pairStatus.textContent = '추천 MP3 로딩 실패';
                }
            });
            window.ShadowingCatalog = Object.freeze({
                getItems: () => dailyCatalog.map(item => ({ ...item })),
                getToday: () => ({ ...recommendedContent }),
                refresh: async () => {
                    try {
                        const items = await fetchR2Catalog();
                        dailyCatalog = items.map(item => ({ ...item, folder: `contents/${item.id}`, base: item.id, source: 'r2' }));
                    } catch (error) {
                        treePromise = null;
                        dailyCatalog = await discoverDailyCatalog();
                    }
                    return dailyCatalog.map(item => ({ ...item }));
                }
            });

            // ==========================================
            // Audio Playback & Loop
            // ==========================================
            function syncPlaybackState() {
                if (!el.mainAudio) return;
                const cur = el.mainAudio.currentTime;

                if (el.seekBar && !isNaN(el.mainAudio.duration)) {
                    el.seekBar.value = cur;
                }
                if (el.currentTimeDisplay) {
                    el.currentTimeDisplay.textContent = formatTime(cur);
                }

                if (state.isLoopActive && state.pointA !== null && state.pointB !== null && state.pointB > state.pointA) {
                    if (cur >= state.pointB) {
                        el.mainAudio.currentTime = state.pointA;
                    }
                }

                renderSubtitleForTime(cur);

            }

            function startRafLoop() {
                cancelAnimationFrame(state.rafId);
                const step = () => {
                    if (el.mainAudio && !el.mainAudio.paused && !el.mainAudio.ended) {
                        syncPlaybackState();
                        state.rafId = requestAnimationFrame(step);
                    }
                };
                state.rafId = requestAnimationFrame(step);
            }

            function stopRafLoop() {
                cancelAnimationFrame(state.rafId);
            }

            function togglePlayPause() {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 상단에서 MP3 오디오 파일을 열어주세요.');
                    return;
                }
                if (el.mainAudio.paused) {
                    el.mainAudio.play().catch(err => console.error(err));
                } else {
                    el.mainAudio.pause();
                }
            }

            el.btnPlayPause?.addEventListener('click', togglePlayPause);

            el.mainAudio?.addEventListener('loadedmetadata', () => {
                if (el.seekBar) el.seekBar.max = el.mainAudio.duration || 100;
                if (el.durationDisplay) el.durationDisplay.textContent = formatTime(el.mainAudio.duration);
                renderSubtitleForTime(0);
            });

            el.mainAudio?.addEventListener('play', () => {
                el.iconPlay?.classList.add('hidden');
                el.iconPause?.classList.remove('hidden');
                startRafLoop();
            });

            el.mainAudio?.addEventListener('pause', () => {
                el.iconPlay?.classList.remove('hidden');
                el.iconPause?.classList.add('hidden');
                stopRafLoop();
                syncPlaybackState();
            });

            el.mainAudio?.addEventListener('ended', () => {
                el.iconPlay?.classList.remove('hidden');
                el.iconPause?.classList.add('hidden');
                stopRafLoop();
                syncPlaybackState();
            });

            el.mainAudio?.addEventListener('timeupdate', syncPlaybackState);

            el.seekBar?.addEventListener('input', (e) => {
                if (!el.mainAudio || !el.mainAudio.src) return;
                el.mainAudio.currentTime = parseFloat(e.target.value) || 0;
                syncPlaybackState();
            });

            el.btnSkipBack?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) return;
                el.mainAudio.currentTime = Math.max(0, el.mainAudio.currentTime - 3);
                syncPlaybackState();
            });

            el.btnSkipForward?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) return;
                const dur = el.mainAudio.duration || 0;
                el.mainAudio.currentTime = Math.min(dur, el.mainAudio.currentTime + 3);
                syncPlaybackState();
            });

            // Volume
            function updateVolumeIcons() {
                if (!el.mainAudio) return;
                const isMuted = el.mainAudio.muted || el.mainAudio.volume === 0;
                if (isMuted) {
                    el.iconVolumeOn?.classList.add('hidden');
                    el.iconVolumeOff?.classList.remove('hidden');
                } else {
                    el.iconVolumeOn?.classList.remove('hidden');
                    el.iconVolumeOff?.classList.add('hidden');
                }
            }

            el.volumeSlider?.addEventListener('input', (e) => {
                if (!el.mainAudio) return;
                const vol = parseFloat(e.target.value);
                el.mainAudio.volume = vol;
                el.mainAudio.muted = (vol === 0);
                updateVolumeIcons();
            });

            el.btnMute?.addEventListener('click', () => {
                if (!el.mainAudio) return;
                el.mainAudio.muted = !el.mainAudio.muted;
                updateVolumeIcons();
            });

            // ==========================================
            // Accordion Panels Toggle Logic
            // ==========================================
            const accordions = [
                { btn: el.toggleLoopBtn, panel: el.panelLoop, chevron: el.chevronLoop },
                { btn: el.toggleSpeedBtn, panel: el.panelSpeed, chevron: el.chevronSpeed },
                { btn: el.toggleRecBtn, panel: el.panelRec, chevron: el.chevronRec }
            ];

            accordions.forEach(({ btn, panel, chevron }) => {
                btn?.addEventListener('click', () => {
                    const isCurrentlyHidden = panel?.classList.contains('hidden');

                    accordions.forEach(item => {
                        item.panel?.classList.add('hidden');
                        item.chevron?.classList.remove('rotate-180');
                        item.btn?.classList.remove('ring-2', 'ring-blue-500/40', 'bg-blue-50');
                    });

                    if (isCurrentlyHidden) {
                        panel?.classList.remove('hidden');
                        chevron?.classList.add('rotate-180');
                        btn?.classList.add('ring-2', 'ring-blue-500/40', 'bg-blue-50');
                    }
                });
            });

            // Toggle only the existing live subtitle card; no transcript list UI.
            const realtimeSubtitleCard = document.getElementById('realtimeSubtitleCard');
            el.toggleScriptBtn?.setAttribute('aria-controls', 'realtimeSubtitleCard');
            el.toggleScriptBtn?.setAttribute('aria-expanded', 'true');
            el.toggleScriptBtn?.addEventListener('click', () => {
                const hidden = realtimeSubtitleCard.classList.toggle('hidden');
                el.toggleScriptBtn.setAttribute('aria-expanded', String(!hidden));
                el.chevronScript?.classList.toggle('rotate-180', !hidden);
                el.toggleScriptBtn.classList.toggle('bg-blue-50', !hidden);
            });

            // ==========================================
            // A-B Loop Controls
            // ==========================================
            function updateLoopUI() {
                if (el.pointADisplay) {
                    el.pointADisplay.textContent = state.pointA !== null ? formatTime(state.pointA, true) : '--:--.--';
                }
                if (el.pointBDisplay) {
                    el.pointBDisplay.textContent = state.pointB !== null ? formatTime(state.pointB, true) : '--:--.--';
                }

                const validLoop = state.isLoopActive && state.pointA !== null && state.pointB !== null && state.pointB > state.pointA;

                if (validLoop) {
                    if (el.loopBadge) {
                        el.loopBadge.textContent = 'ON';
                        el.loopBadge.className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-700';
                    }
                    if (el.btnToggleLoopActive) {
                        el.btnToggleLoopActive.textContent = '반복 상태: ON';
                        el.btnToggleLoopActive.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-700 border border-amber-300 transition';
                    }
                } else {
                    if (el.loopBadge) {
                        el.loopBadge.textContent = 'OFF';
                        el.loopBadge.className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-200 text-slate-600';
                    }
                    if (el.btnToggleLoopActive) {
                        el.btnToggleLoopActive.textContent = '반복 상태: OFF';
                        el.btnToggleLoopActive.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 transition';
                    }
                }
            }

            el.btnSetA?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 오디오 파일을 열어주세요.');
                    return;
                }
                state.pointA = el.mainAudio.currentTime;
                if (state.pointB !== null && state.pointB > state.pointA) {
                    state.isLoopActive = true;
                }
                updateLoopUI();
                showToast(`Point A 설정: ${formatTime(state.pointA, true)}`);
            });

            el.btnSetB?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 오디오 파일을 열어주세요.');
                    return;
                }
                const cur = el.mainAudio.currentTime;
                if (state.pointA === null) {
                    state.pointA = Math.max(0, cur - 3);
                }
                if (cur <= state.pointA) {
                    showToast('Point B는 Point A보다 뒤의 시간이어야 합니다.');
                    return;
                }
                state.pointB = cur;
                state.isLoopActive = true;
                updateLoopUI();
                showToast(`Point B 설정: ${formatTime(state.pointB, true)}`);
            });

            el.btnResetLoop?.addEventListener('click', () => {
                state.pointA = null;
                state.pointB = null;
                state.isLoopActive = false;
                updateLoopUI();
                showToast('A-B 구간이 초기화되었습니다.');
            });

            el.btnToggleLoopActive?.addEventListener('click', () => {
                if (state.pointA === null || state.pointB === null || state.pointB <= state.pointA) {
                    showToast('먼저 유효한 Point A와 Point B를 설정해주세요.');
                    return;
                }
                state.isLoopActive = !state.isLoopActive;
                updateLoopUI();
            });

            el.btnNudgeAMinus?.addEventListener('click', () => {
                if (state.pointA !== null) {
                    state.pointA = Math.max(0, state.pointA - 0.1);
                    updateLoopUI();
                }
            });
            el.btnNudgeAPlus?.addEventListener('click', () => {
                if (state.pointA !== null) {
                    state.pointA += 0.1;
                    updateLoopUI();
                }
            });
            el.btnNudgeBMinus?.addEventListener('click', () => {
                if (state.pointB !== null) {
                    state.pointB = Math.max((state.pointA || 0) + 0.1, state.pointB - 0.1);
                    updateLoopUI();
                }
            });
            el.btnNudgeBPlus?.addEventListener('click', () => {
                if (state.pointB !== null) {
                    const maxDur = el.mainAudio?.duration || Infinity;
                    state.pointB = Math.min(maxDur, state.pointB + 0.1);
                    updateLoopUI();
                }
            });

            // ==========================================
            // Playback Speed
            // ==========================================
            function setPlaybackSpeed(speedVal) {
                const speed = parseFloat(speedVal) || 1.0;
                if (el.mainAudio) el.mainAudio.playbackRate = speed;
                if (el.speedSlider) el.speedSlider.value = speed;

                const formatted = `${speed.toFixed(2).replace(/\.00$/, '.0')}x`;
                if (el.speedBadge) el.speedBadge.textContent = formatted;
                if (el.speedPanelDisplay) el.speedPanelDisplay.textContent = formatted;

                el.speedPresetBtns?.forEach(btn => {
                    const btnSpeed = parseFloat(btn.dataset.speed);
                    if (Math.abs(btnSpeed - speed) < 0.01) {
                        btn.className = 'speed-preset-btn py-1.5 rounded-xl bg-blue-600 text-white font-mono text-xs font-bold shadow-sm transition';
                    } else {
                        btn.className = 'speed-preset-btn py-1.5 rounded-xl bg-slate-100 hover:bg-blue-50 text-slate-700 font-mono text-xs font-semibold transition';
                    }
                });
            }

            el.speedSlider?.addEventListener('input', (e) => setPlaybackSpeed(e.target.value));
            el.speedPresetBtns?.forEach(btn => {
                btn.addEventListener('click', () => setPlaybackSpeed(btn.dataset.speed));
            });

            // ==========================================
            // Recording & Sequential Compare
            // ==========================================
            el.btnRecordToggle?.addEventListener('click', async () => {
                if (!state.isRecording) {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            showToast('이 브라우저에서는 마이크 녹음을 지원하지 않습니다.');
                            return;
                        }
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        state.audioChunks = [];

                        let options = { mimeType: 'audio/webm;codecs=opus' };
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                            options = { mimeType: 'audio/mp4' };
                            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                                options = {};
                            }
                        }

                        state.mediaRecorder = new MediaRecorder(stream, options);
                        state.recordedMime = state.mediaRecorder.mimeType || 'audio/webm';

                        state.mediaRecorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) {
                                state.audioChunks.push(e.data);
                            }
                        };

                        state.mediaRecorder.onstop = () => {
                            const blob = new Blob(state.audioChunks, { type: state.recordedMime });
                            if (state.recordedBlobUrl) {
                                URL.revokeObjectURL(state.recordedBlobUrl);
                            }
                            state.recordedBlobUrl = URL.createObjectURL(blob);
                            if (el.recordedAudio) {
                                el.recordedAudio.src = state.recordedBlobUrl;
                                el.recordedAudio.load();
                            }

                            if (el.btnPlayMyVoice) el.btnPlayMyVoice.disabled = false;
                            if (el.btnDownloadVoice) el.btnDownloadVoice.disabled = false;
                            if (el.btnDeleteVoice) el.btnDeleteVoice.disabled = false;
                            if (el.btnSequentialCompare) el.btnSequentialCompare.disabled = false;

                            if (el.recStatusBadge) {
                                el.recStatusBadge.textContent = '녹음 완료';
                                el.recStatusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700';
                            }

                            stream.getTracks().forEach(track => track.stop());
                            showToast('음성 녹음이 완료되었습니다!');
                        };

                        state.mediaRecorder.start(250);
                        state.isRecording = true;

                        if (el.recBtnLabel) el.recBtnLabel.textContent = '녹음 중지';
                        el.btnRecordToggle?.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                        el.btnRecordToggle?.classList.add('bg-slate-800', 'hover:bg-slate-900', 'rec-active');

                        if (el.recStatusBadge) {
                            el.recStatusBadge.textContent = '녹음 중...';
                            el.recStatusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-600';
                        }
                    } catch (err) {
                        console.error('Microphone error:', err);
                        showToast('마이크 접근 권한이 거부되었거나 지원되지 않습니다.');
                    }
                } else {
                    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
                        state.mediaRecorder.stop();
                    }
                    state.isRecording = false;

                    if (el.recBtnLabel) el.recBtnLabel.textContent = '녹음 시작';
                    el.btnRecordToggle?.classList.remove('bg-slate-800', 'hover:bg-slate-900', 'rec-active');
                    el.btnRecordToggle?.classList.add('bg-rose-600', 'hover:bg-rose-700');
                }
            });

            el.btnPlayMyVoice?.addEventListener('click', () => {
                if (!el.recordedAudio || !el.recordedAudio.src) return;

                if (!el.recordedAudio.paused) {
                    el.recordedAudio.pause();
                    el.recordedAudio.currentTime = 0;
                    if (el.iconPlayVoice) el.iconPlayVoice.classList.remove('hidden');
                    if (el.iconStopVoice) el.iconStopVoice.classList.add('hidden');
                    if (el.playVoiceLabel) el.playVoiceLabel.textContent = '내 목소리 듣기';
                    showToast('녹음 재생이 중지되었습니다.');
                } else {
                    el.mainAudio?.pause();
                    el.recordedAudio.currentTime = 0;
                    el.recordedAudio.play().then(() => {
                        if (el.iconPlayVoice) el.iconPlayVoice.classList.add('hidden');
                        if (el.iconStopVoice) el.iconStopVoice.classList.remove('hidden');
                        if (el.playVoiceLabel) el.playVoiceLabel.textContent = '재생 중지';
                        showToast('녹음된 내 목소리를 재생합니다.');
                    }).catch(err => {
                        console.error('Playback error:', err);
                        showToast('녹음된 오디오 재생 중 오류가 발생했습니다.');
                    });
                }
            });

            el.recordedAudio?.addEventListener('ended', () => {
                if (el.iconPlayVoice) el.iconPlayVoice.classList.remove('hidden');
                if (el.iconStopVoice) el.iconStopVoice.classList.add('hidden');
                if (el.playVoiceLabel) el.playVoiceLabel.textContent = '내 목소리 듣기';
            });

            el.btnDeleteVoice?.addEventListener('click', () => {
                if (state.isRecording) {
                    showToast('녹음을 중지한 후 삭제해 주세요.');
                    return;
                }
                if (!state.recordedBlobUrl) return;

                // Cancel any running A/B voice comparison before revoking its audio URL.
                state.compareId++;
                state.comparing = false;
                state.isLoopActive = false;
                if (el.btnSequentialCompare) {
                    el.btnSequentialCompare.innerHTML = '<i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i><span>원어민 → 내 목소리 비교</span>';
                }
                el.mainAudio?.pause();
                if (el.recordedAudio) {
                    el.recordedAudio.pause();
                    el.recordedAudio.removeAttribute('src');
                    el.recordedAudio.load();
                }
                URL.revokeObjectURL(state.recordedBlobUrl);
                state.recordedBlobUrl = null;
                state.audioChunks = [];
                state.recordedMime = '';
                if (el.btnPlayMyVoice) el.btnPlayMyVoice.disabled = true;
                if (el.btnDownloadVoice) el.btnDownloadVoice.disabled = true;
                if (el.btnDeleteVoice) el.btnDeleteVoice.disabled = true;
                if (el.btnSequentialCompare) el.btnSequentialCompare.disabled = true;
                if (el.iconPlayVoice) el.iconPlayVoice.classList.remove('hidden');
                if (el.iconStopVoice) el.iconStopVoice.classList.add('hidden');
                if (el.playVoiceLabel) el.playVoiceLabel.textContent = '내 목소리 듣기';
                if (el.recStatusBadge) {
                    el.recStatusBadge.textContent = '준비됨';
                    el.recStatusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-500';
                }
                if (typeof lucide !== 'undefined') lucide.createIcons();
                showToast('현재 녹음을 삭제했습니다.');
            });

            el.btnDownloadVoice?.addEventListener('click', () => {
                if (!state.recordedBlobUrl) return;
                const link = document.createElement("a");
                link.href = state.recordedBlobUrl;
                link.download = state.recordedMime.includes("mp4") ? "shadowing_recording.m4a" : "shadowing_recording.webm";
                link.click();
            });

            function waitUntil(audioElement, end, token) {
                return new Promise(resolve => {
                    function tick() {
                        if (token !== state.compareId || audioElement.paused || audioElement.ended || audioElement.currentTime >= end) {
                            resolve();
                        } else {
                            requestAnimationFrame(tick);
                        }
                    }
                    requestAnimationFrame(tick);
                });
            }

            el.btnSequentialCompare?.addEventListener('click', async () => {
                if (state.comparing) {
                    state.compareId++;
                    state.comparing = false;
                    if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "원어민 → 내 목소리 비교";
                    el.mainAudio?.pause();
                    el.recordedAudio?.pause();
                    return;
                }

                if (!state.recordedBlobUrl) {
                    showToast('먼저 음성을 녹음해주세요.');
                    return;
                }
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('원어민 MP3 오디오 파일이 필요합니다.');
                    return;
                }

                let start = 0, end = 0;
                if (state.pointA !== null && state.pointB !== null && state.pointB > state.pointA) {
                    start = state.pointA;
                    end = state.pointB;
                } else {
                    const list = state.subtitles[state.currentLang] || [];
                    const cur = el.mainAudio.currentTime;
                    let active = list.find(c => cur >= c.start && cur < c.end);
                    if (active) {
                        start = active.start;
                        end = active.end;
                    } else {
                        start = Math.max(0, cur - 3);
                        end = Math.min(el.mainAudio.duration || start + 3, start + 3);
                    }
                }

                if (end <= start) {
                    showToast('비교할 구간이 없습니다.');
                    return;
                }

                const token = ++state.compareId;
                state.comparing = true;
                if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "■ 비교 중지";

                const prevLoop = state.isLoopActive;
                state.isLoopActive = false;

                el.mainAudio.pause();
                el.recordedAudio?.pause();
                el.mainAudio.currentTime = start;

                try {
                    await el.mainAudio.play();
                    await waitUntil(el.mainAudio, end, token);
                    el.mainAudio.pause();

                    if (token !== state.compareId) return;

                    if (el.recordedAudio) {
                        el.recordedAudio.currentTime = 0;
                        await el.recordedAudio.play();
                        showToast('원어민 구간 다음으로 내 목소리를 재생합니다.');
                    }
                } catch (err) {
                    console.error("Compare error:", err);
                } finally {
                    if (token === state.compareId) {
                        state.comparing = false;
                        state.isLoopActive = prevLoop;
                        if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "원어민 → 내 목소리 비교";
                    }
                }
            });

            // ==========================================
            // Keyboard Shortcuts
            // ==========================================
            document.addEventListener('keydown', (e) => {
                const tag = e.target?.tagName?.toUpperCase();
                if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) {
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    el.btnSkipBack?.click();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    el.btnSkipForward?.click();
                } else if (e.code === 'KeyA') {
                    e.preventDefault();
                    el.btnSetA?.click();
                } else if (e.code === 'KeyB') {
                    e.preventDefault();
                    el.btnSetB?.click();
                }
            });
        });
    </script>

    <!-- 1차 10분 학습: 화면 변경 없는 브라우저 로컬 진행 기록 -->
    <script>
    (() => {
        'use strict';
        const TARGET_SECONDS = 600;
        const STORAGE_PREFIX = 'shadowing-daily-v1:';
        const audio = document.getElementById('mainAudio');
        const fileInput = document.getElementById('bundleFiles');
        if (!audio) return;

        const today = () => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
        }).format(new Date());
        let currentDay = today();
        let progress = readProgress(currentDay);
        let lastTick = null;
        let lastSave = 0;
        let currentSource = 'recommended';

        function readProgress(day) {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_PREFIX + day) || 'null');
                return saved && typeof saved.seconds === 'number'
                    ? { seconds: Math.max(0, Math.min(86400, saved.seconds)), completed: !!saved.completed, ...saved }
                    : { seconds: 0, completed: false, sources: {} };
            } catch (_) {
                return { seconds: 0, completed: false, sources: {} };
            }
        }
        function persist() {
            try {
                localStorage.setItem(STORAGE_PREFIX + currentDay, JSON.stringify({
                    seconds: progress.seconds,
                    completed: progress.completed,
                    completedAt: progress.completedAt || null,
                    sources: progress.sources || {},
                    updatedAt: new Date().toISOString()
                }));
            } catch (err) {
                console.warn('학습 기록 저장 불가:', err);
            }
        }
        function notify(text) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = text;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 4500);
            } else {
                // 기존 UI의 토스트 구현에 종속되지 않도록 기본 메시지도 제공합니다.
                console.info('[Daily Learning]', text);
            }
        }
        function checkDate() {
            const nowDay = today();
            if (nowDay !== currentDay) {
                persist();
                currentDay = nowDay;
                progress = readProgress(nowDay);
                lastTick = null;
            }
        }
        function tick() {
            checkDate();
            const now = performance.now();
            if (lastTick !== null && !audio.paused && !audio.ended && audio.readyState >= 2 && !audio.seeking) {
                // 타이머 중단, 절전, 백그라운드 지연 시 비정상적으로 큰 구간은 집계하지 않음
                const delta = Math.max(0, Math.min((now - lastTick) / 1000, 2));
                progress.seconds += delta;
                progress.sources ||= {};
                progress.sources[currentSource] = (progress.sources[currentSource] || 0) + delta;
                if (!progress.completed && progress.seconds >= TARGET_SECONDS) {
                    progress.completed = true;
                    progress.completedAt = new Date().toISOString();
                    persist();
                    notify('오늘의 10분 학습을 완료했습니다! 🎉');
                    document.dispatchEvent(new CustomEvent('shadowing:daily-complete', {
                        detail: { date: currentDay, seconds: progress.seconds }
                    }));
                }
                if (now - lastSave > 5000) {
                    persist();
                    lastSave = now;
                }
            }
            lastTick = !audio.paused && !audio.ended ? now : null;
        }
        // 브라우저 로컬 파일 선택 시 자유 학습으로 구분
        fileInput?.addEventListener('change', event => {
            if (Array.from(event.target.files || []).some(f => /\.(mp3|wav|m4a|ogg)$/i.test(f.name))) {
                currentSource = 'free';
                tick();
            }
        }, true);
        // 추천 콘텐츠로 되돌릴 경우 재설정 가능
        document.addEventListener('shadowing:recommended-loaded', () => { tick(); currentSource = 'recommended'; });
        audio.addEventListener('play', () => { lastTick = performance.now(); });
        for (const eventName of ['pause', 'ended', 'waiting', 'seeking', 'error']) {
            audio.addEventListener(eventName, () => { tick(); lastTick = null; persist(); });
        }
        audio.addEventListener('playing', () => { lastTick = performance.now(); });
        document.addEventListener('visibilitychange', () => { tick(); persist(); });
        window.addEventListener('pagehide', () => { tick(); persist(); });
        setInterval(tick, 1000);
        window.ShadowingDaily = Object.freeze({
            getProgress: () => {
                tick();
                return { date: currentDay, seconds: Math.floor(progress.seconds),
                    targetSeconds: TARGET_SECONDS, completed: progress.completed,
                    sources: { ...(progress.sources || {}) } };
            },
            getHistory: (days = 30) => {
                const result = [];
                const date = new Date(currentDay + 'T12:00:00Z');
                for (let i = 0; i < Math.min(365, Math.max(1, days)); i++) {
                    const key = date.toISOString().slice(0, 10);
                    result.push({ date: key, ...readProgress(key) });
                    date.setUTCDate(date.getUTCDate() - 1);
                }
                return result;
            }
        });
        console.info('Daily 10-Minute Learning 준비됨:', window.ShadowingDaily.getProgress());
    })();
    </script>

      const exclude = 'script,style,#currentSubtitleText,#loadedAudioName,#uiLanguageToggle,.transcript-row';
      const records = new WeakMap();
      let language = 'ko';
      try { language = localStorage.getItem('shadowing-ui-language') === 'en' ? 'en' : 'ko'; } catch (_) {}
      function translate(value) {
        let output = value;
        for (const [ko,en] of translations) output = output.split(ko).join(en);
        return output;
      }
      function excluded(element) { return !!element?.closest?.(exclude); }
      function updateText(node) {
        if (!node.parentElement || excluded(node.parentElement)) return;
        const current = node.nodeValue;
        let record = records.get(node);
        if (!record || current !== record.rendered) {
          record = { original: current, rendered: current };
          records.set(node, record);
        }
        const next = language === 'en' ? translate(record.original) : record.original;
        if (current !== next) node.nodeValue = next;
        record.rendered = next;
      }
      const attrs = ['title','aria-label','placeholder'];
      function updateAttributes(element) {
        if (excluded(element)) return;
        for (const attr of attrs) {
          if (!element.hasAttribute(attr)) continue;
          const key = 'uiOriginal' + attr.replace(/[^a-z]/gi,'');
          const renderedKey = key + 'Rendered';
          const current = element.getAttribute(attr);
          if (element.dataset[renderedKey] !== current) element.dataset[key] = current;
          const original = element.dataset[key];
          const next = language === 'en' ? translate(original) : original;
          if (current !== next) element.setAttribute(attr,next);
          element.dataset[renderedKey] = next;
        }
      }
      function updateTree(root) {
        if (root.nodeType === Node.TEXT_NODE) return updateText(root);
        if (root.nodeType !== Node.ELEMENT_NODE || excluded(root)) return;
        updateAttributes(root);
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (node.nodeType === Node.TEXT_NODE) updateText(node);
          else updateAttributes(node);
        }
      }
      function refresh() {
        document.documentElement.lang = language;
        const toggle = document.getElementById('uiLanguageToggle');
        toggle.textContent = language === 'ko' ? 'English' : '한국어';
        toggle.setAttribute('aria-label', language === 'ko' ? 'Switch interface language to English' : '메뉴 언어를 한국어로 변경');
        toggle.title = toggle.getAttribute('aria-label');
        updateTree(document.body);
        document.dispatchEvent(new CustomEvent('shadowing:ui-language', { detail: { language } }));
      }
      function setLanguage(next) {
        language = next;
        try { localStorage.setItem('shadowing-ui-language',next); } catch (_) {}
        refresh();
      }
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('uiLanguageToggle').addEventListener('click', () => setLanguage(language === 'ko' ? 'en' : 'ko'));
        refresh();
        const observer = new MutationObserver(mutations => {
          for (const mutation of mutations) {
            if (mutation.type === 'characterData') updateText(mutation.target);
            else if (mutation.type === 'attributes') updateAttributes(mutation.target);
            else for (const node of mutation.addedNodes) updateTree(node);
          }
        });
        observer.observe(document.body, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:attrs});
      });
    })();
    </script>

    <!-- Study Guide: optional static metadata, no R2 API/schema changes -->
    <script>
    (() => {
      'use strict';
      const button = document.getElementById('toggleGuideBtn');
      const panel = document.getElementById('panelGuide');
      const audio = document.getElementById('mainAudio');
      const list = document.getElementById('guideSections');
      const review = document.getElementById('guideReviewBtn');
      if (!button || !panel || !audio || !list || !review) return;
      const ID_PATTERN = /^[A-Za-z0-9_-]{11}$/;
      let guide = null, guideId = null, requestSerial = 0, activeSrc = '';
      const uiLang = () => document.documentElement.lang === 'en' ? 'en' : 'ko';
      const localize = (obj, key) => obj?.[key + (uiLang() === 'en' ? 'En' : 'Ko')] || obj?.[key + 'Ko'] || '';
      const label = (ko, en) => uiLang() === 'en' ? en : ko;
      const fmt = seconds => `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
      function seek(seconds) {
        if (!audio.src) return;
        const time = Number(seconds);
        if (!Number.isFinite(time) || time < 0) return;
        const apply = () => {
          const max = Number.isFinite(audio.duration) ? Math.max(0, audio.duration - 0.05) : time;
          audio.currentTime = Math.min(time, max);
          audio.play().catch(() => {});
        };
        if (audio.readyState >= 1) apply();
        else audio.addEventListener('loadedmetadata', apply, { once: true });
      }
      function hide() {
        guide = null; guideId = null;
        button.classList.add('hidden');
        panel.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
        review.classList.add('hidden');
        list.replaceChildren();
      }
      function render() {
        if (!guide) return;
        document.getElementById('guideToggleLabel').textContent = label('학습 가이드','Study Guide');
        document.getElementById('guideHeading').textContent = localize(guide.title,'title') || label('학습 가이드','Study Guide');
        document.getElementById('guideDescription').textContent = localize(guide,'description');
        document.getElementById('guideCount').textContent = `${guide.sections.length} ${label('개 학습 주제','topics')}`;
        list.replaceChildren();
        for (const section of guide.sections) {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'w-full text-left flex items-start gap-3 p-3 rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-200 transition';
          const time = document.createElement('span');
          time.className = 'shrink-0 font-mono text-xs font-bold text-amber-700 bg-amber-100 px-2 py-1 rounded-lg';
          time.textContent = fmt(section.time);
          const info = document.createElement('span');
          info.className = 'min-w-0 flex-1 flex flex-col gap-1';
          const name = document.createElement('span');
          name.className = 'text-sm font-bold text-slate-800';
          name.textContent = section.pattern;
          const summary = document.createElement('span');
          summary.className = 'text-xs text-slate-600 leading-relaxed';
          summary.textContent = localize(section,'summary');
          info.append(name,summary);
          if (Array.isArray(section.examples) && section.examples.length) {
            const examples = document.createElement('span');
            examples.className = 'text-xs text-blue-700';
            examples.textContent = section.examples.join(' · ');
            info.append(examples);
          }
          row.append(time,info);
          row.setAttribute('aria-label', `${fmt(section.time)} ${section.pattern}`);
          row.addEventListener('click', () => seek(section.time));
          list.append(row);
        }
        if (Number.isFinite(guide.reviewStart)) {
          review.classList.remove('hidden');
          review.textContent = `${label('영어만 듣기','English-only Review')} · ${fmt(guide.reviewStart)} ▶`;
        } else review.classList.add('hidden');
      }
      async function fetchGuide(id) {
        // Optional public metadata. R2 audio and signed URLs remain private and unchanged.
        const path = `study-guides/${encodeURIComponent(id)}.json`;
        const urls = [`/${path}`, `https://raw.githubusercontent.com/munjojung/audio_shadowing_youtube/main/${path}`];
        for (const url of urls) {
          try {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) continue;
            const data = await res.json();
            if (data.contentId !== id || !Array.isArray(data.sections)) continue;
            if (!data.sections.every(s => typeof s.pattern === 'string' && Number.isFinite(s.time) && s.time >= 0)) continue;
            return data;
          } catch (error) { console.info('[Study Guide] optional guide unavailable:', error); }
        }
        return null;
      }
      function currentContentId() {
        const src = audio.currentSrc || audio.src || '';
        if (!src) return null;
        if (src.startsWith('blob:')) {
          const filename = document.getElementById('loadedAudioName')?.textContent || '';
          return filename.match(/_([A-Za-z0-9_-]{11})\.(?:mp3|wav|m4a|ogg)/i)?.[1] || null;
        }
        const requested = new URLSearchParams(location.search).get('content');
        const today = window.ShadowingCatalog?.getToday?.();
        const candidate = requested && ID_PATTERN.test(requested) ? requested : (today?.source === 'r2' ? today.base : null);
        if (candidate && ID_PATTERN.test(candidate)) return candidate;
        const match = src.match(/(?:^|\/)([A-Za-z0-9_-]{11})\//);
        return match?.[1] || null;
      }
      async function syncGuide() {
        const id = currentContentId();
        const src = audio.currentSrc || audio.src || '';
        if (src === activeSrc && id === guideId && guide) return;
        activeSrc = src;
        const serial = ++requestSerial;
        hide();
        if (!id || !ID_PATTERN.test(id)) return;
        const data = await fetchGuide(id);
        if (serial !== requestSerial || (audio.currentSrc || audio.src || '') !== src) return;
        if (!data) return;
        guide = data;
        guideId = id;
        button.classList.remove('hidden');
        render();
        if (window.lucide) window.lucide.createIcons();
      }
      button.addEventListener('click', () => {
        const willOpen = panel.classList.contains('hidden');
        panel.classList.toggle('hidden', !willOpen);
        button.setAttribute('aria-expanded', String(willOpen));
        document.getElementById('chevronGuide')?.classList.toggle('rotate-180', willOpen);
      });
      review.addEventListener('click', () => { if (guide) seek(guide.reviewStart); });
      document.addEventListener('shadowing:ui-language', render);
      document.addEventListener('shadowing:recommended-loaded', () => { syncGuide(); });
      audio.addEventListener('loadstart', () => { activeSrc = ''; ++requestSerial; hide(); });
      audio.addEventListener('loadedmetadata', () => { syncGuide(); });
      // Initial recommended content is loaded asynchronously by the existing player.
      if (audio.src) syncGuide();
    })();
    </script>
