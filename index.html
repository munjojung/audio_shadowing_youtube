
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowing Player Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans KR"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 9999px;
            background: #e2e8f0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            margin-top: -5px;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.4);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        /* Recording Pulse Animation */
        @keyframes pulse-rec {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .rec-active {
            animation: pulse-rec 1.5s infinite;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }

            const OWNER = "munjojung";
            const REPO = "audio_shadowing_youtube";
            const BRANCH = "main";

            // ==========================================
            // Helper Functions
            // ==========================================
            function parseTimestamp(value) {
                const match = String(value).trim().replace(',', '.').match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?$/);
                if (!match) return NaN;
                const h = Number(match[1] || 0), m = Number(match[2]), sec = Number(match[3]);
                if (m >= 60 && match[1] || sec >= 60) return NaN;
                return h * 3600 + m * 60 + sec + Number((match[4] || '0').padEnd(3, '0')) / 1000;
            }

            function parseVTT(vttText) {
                if (!vttText) return [];
                const text = String(vttText).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
                const cues = [];
                for (const block of text.split(/\n\s*\n/)) {
                    const lines = block.trim().split('\n');
                    if (/^(WEBVTT|NOTE|STYLE|REGION)(?:\s|$)/i.test(lines[0] || '')) continue;
                    const index = lines.findIndex(line => line.includes('-->'));
                    if (index < 0) continue;
                    const match = lines[index].match(/(\S+)\s+-->\s+(\S+)/);
                    if (!match) continue;
                    const start = parseTimestamp(match[1]), end = parseTimestamp(match[2]);
                    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) continue;
                    const content = lines.slice(index + 1).join(' ').replace(/<[^>]*>/g, '').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/^\s*(?:>>|>)+\s*/, '').trim();
                    if (content) cues.push({start, end, text: content});
                }
                return cues.sort((a, b) => a.start - b.start);
            }

            function formatTime(seconds, includeMs = false) {
                if (isNaN(seconds) || seconds < 0) return includeMs ? "00:00.00" : "00:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                const pad = (n) => String(n).padStart(2, '0');
                if (includeMs) {
                    const ms = Math.floor((seconds % 1) * 100);
                    return `${pad(mins)}:${pad(secs)}.${String(ms).padStart(2, '0')}`;
                }
                return `${pad(mins)}:${pad(secs)}`;
            }

            function message(text) {
                const noticeEl = document.getElementById('notice');
                if (noticeEl) noticeEl.textContent = text;
                if (!noticeEl && /연결 실패|검색 오류|처리 오류/.test(text)) {
                    console.warn("Shadowing Player subtitle diagnostics:", text);
                    showToast("자막 연결 실패: 개발자 도구(F12) Console에서 상세 오류를 확인하세요.");
                }
            }

            let toastTimer = null;
            function showToast(msg) {
                const banner = document.getElementById('toastBanner');
                const textEl = document.getElementById('toastText');
                if (!banner || !textEl) return;
                textEl.textContent = msg;
                banner.classList.remove('translate-y-20', 'opacity-0');
                banner.classList.add('translate-y-0', 'opacity-100');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    banner.classList.remove('translate-y-0', 'opacity-100');
                    banner.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            function videoId(base) {
                return base.match(/_([A-Za-z0-9_-]{11})$/)?.[1] || "";
            }

            function rawUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encoded}`;
            }

            function cdnUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/${encoded}`;
            }

            function apiUrl(path) {
                const encoded = path.split("/").map(encodeURIComponent).join("/");
                return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encoded}?ref=${BRANCH}`;
            }

            async function downloadVTT(path) {
                const urls = [rawUrl(path), cdnUrl(path), apiUrl(path)];
                const errors = [];

                for (const url of urls) {
                    try {
                        const response = await fetch(url, { cache: "no-store" });
                        if (!response.ok) {
                            errors.push(`HTTP ${response.status}: ${url}`);
                            continue;
                        }

                        let text = await response.text();

                        if (url.includes("api.github.com") && text.trimStart().startsWith("{")) {
                            const json = JSON.parse(text);
                            if (json.encoding === "base64" && json.content) {
                                const bytes = Uint8Array.from(
                                    atob(json.content.replace(/\s/g, "")),
                                    c => c.charCodeAt(0)
                                );
                                text = new TextDecoder("utf-8").decode(bytes);
                            }
                        }

                        const cues = parseVTT(text);
                        if (cues.length) return { cues, url, errors: [] };
                        errors.push(`VTT 문장 없음: ${url}`);
                    } catch (error) {
                        errors.push(`${error.message}: ${url}`);
                    }
                }

                return { cues: [], url: null, errors };
            }

            async function repositoryPaths() {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
                const response = await fetch(url, { cache: "no-store" });
                if (!response.ok) throw Error(`GitHub 목록 조회 HTTP ${response.status}`);
                const json = await response.json();
                if (json.truncated) throw Error("GitHub 파일 목록이 잘렸습니다.");
                return (json.tree || []).filter(item => item.type === "blob" && item.path).map(item => item.path);
            }

            let treePromise = null;
            function getTree() {
                if (!treePromise) {
                    treePromise = repositoryPaths().catch(error => {
                        treePromise = null;
                        throw error;
                    });
                }
                return treePromise;
            }

            async function findSubtitle(base, lang) {
                const name = `${base}_${lang}.vtt`;
                const id = videoId(base);
                const errors = [];
                const tried = new Set();
                async function attempt(path) {
                    if (tried.has(path)) return null;
                    tried.add(path);
                    const result = await downloadVTT(path);
                    if (result.cues.length) return result;
                    errors.push(...result.errors);
                    return null;
                }
                // Primary layout confirmed by user: repo / YouTube-ID / filename_language.vtt
                if (id) {
                    const result = await attempt(`${id}/${name}`);
                    if (result) return result;
                }
                // Repository-wide fallback only if primary path fails.
                try {
                    const paths = await getTree();
                    const target = name.toLowerCase();
                    const exact = paths.filter(path => path.split('/').pop().toLowerCase() === target);
                    const candidates = exact.length ? exact : paths.filter(path => {
                        const filename = path.split('/').pop().toLowerCase();
                        return filename.endsWith(`_${lang}.vtt`) && id && path.toLowerCase().includes(id.toLowerCase());
                    });
                    for (const path of candidates) {
                        const result = await attempt(path);
                        if (result) return result;
                    }
                    if (!candidates.length) errors.push(`GitHub 파일 목록에서 ${name}을 찾지 못했습니다.`);
                } catch (error) {
                    errors.push(`GitHub 전체 검색 실패: ${error.message}`);
                }
                if (!id) {
                    const result = await attempt(name);
                    if (result) return result;
                }
                return { cues: [], url: null, errors };
            }

            function renderSubtitleForTime(currentTime) {
                if (!el.currentSubtitleText) return;
                const list = state.subtitles[state.currentLang] || [];

                if (list.length === 0) {
                    const otherLang = state.currentLang === 'ko' ? 'en' : 'ko';
                    const msg = (state.subtitles[otherLang] || []).length > 0
                        ? (state.currentLang === 'ko' ? '한국어(KO) VTT 자막이 없습니다.' : 'English (EN) VTT file is not available.')
                        : '오디오를 불러오세요.';
                    
                    el.currentSubtitleText.textContent = msg;
                    if (el.cueTime) el.cueTime.textContent = formatTime(currentTime, true);
                    state.activeCueIndex = -1;
                    return;
                }

                let matchedIdx = -1;
                for (let i = 0; i < list.length; i++) {
                    if (currentTime >= list[i].start && currentTime < list[i].end) {
                        matchedIdx = i;
                        break;
                    }
                }

                if (matchedIdx === -1) {
                    for (let i = list.length - 1; i >= 0; i--) {
                        if (currentTime >= list[i].start) {
                            matchedIdx = i;
                            break;
                        }
                    }
                }

                if (matchedIdx === -1 && list.length > 0) {
                    matchedIdx = 0;
                }

                state.activeCueIndex = matchedIdx;
                if (matchedIdx >= 0 && list[matchedIdx]) {
                    const cue = list[matchedIdx];
                    el.currentSubtitleText.textContent = cue.text;
                    if (el.cueTime) {
                        el.cueTime.textContent = `${formatTime(cue.start, true)} ~ ${formatTime(cue.end, true)}`;
                    }
                }
            }

                const curTime = el.mainAudio ? el.mainAudio.currentTime : 0;

            // ==========================================
            // Audio Loading & Bundle Handling
            // ==========================================
            function resetAudioState() {
                state.loadId++;
                state.compareId++;
                state.comparing = false;
                if (el.mainAudio) el.mainAudio.pause();
                if (el.recordedAudio) el.recordedAudio.pause();
                state.subtitles = { ko: [], en: [] };
                state.pointA = null;
                state.pointB = null;
                state.isLoopActive = false;
                updateLoopUI();
            }

            async function loadFiles(fileList) {
                const files = Array.from(fileList || []);
                const mp3File = files.find(f => /\.(mp3|wav|m4a|ogg)$/i.test(f.name) || f.type.startsWith("audio/"));

                if (!mp3File) {
                    message("MP3 오디오 파일을 선택하세요.");
                    return;
                }

                resetAudioState();
                const token = state.loadId;

                if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
                state.objectUrl = URL.createObjectURL(mp3File);
                if (el.mainAudio) {
                    el.mainAudio.src = state.objectUrl;
                    el.mainAudio.load();
                    el.mainAudio.currentTime = 0;
                    el.mainAudio.play().catch(() => {});
                }

                if (el.loadedAudioName) el.loadedAudioName.textContent = mp3File.name;
                if (el.audioLabelText) el.audioLabelText.textContent = 'MP3 + VTT 변경';

                const base = mp3File.name.replace(/\.[^.]+$/, "");

                if (el.pairStatus) el.pairStatus.textContent = "한국어·영어 자막 검색 중…";

                const results = await Promise.all(
                    ["ko", "en"].map(async lang => {
                        const name = `${base}_${lang}.vtt`.toLowerCase();
                        const local = files.find(f => f.name.toLowerCase() === name);
                        if (local) {
                            try {
                                const text = await local.text();
                                const cues = parseVTT(text);
                                if (cues.length) return { cues, url: "로컬 파일", errors: [] };
                            } catch(e) {}
                        }
                        return findSubtitle(base, lang);
                    })
                );

                if (token !== state.loadId) return;

                state.subtitles.ko = results[0].cues;
                state.subtitles.en = results[1].cues;

                if (el.pairStatus) {
                    el.pairStatus.textContent = `자동 자막 연결: ${state.subtitles.ko.length ? "KO ✓" : "KO 없음"} · ${state.subtitles.en.length ? "EN ✓" : "EN 없음"}`;
                }

                if (state.subtitles.ko.length > 0) {
                    setLanguage('ko');
                } else if (state.subtitles.en.length > 0) {
                    setLanguage('en');
                } else {
                    renderSubtitleForTime(0);

                }

                const success = results.map((res, i) => `${i === 0 ? "KO" : "EN"}: ${res.cues.length ? `${res.cues.length}문장 연결 (${res.url})` : "연결 실패"}`);
                const errors = results.flatMap(res => res.errors || []);
                const detail = success.join("\n") + (errors.length ? "\n검색 오류:\n" + errors.slice(0, 8).join("\n") : "");
                console.info("Shadowing Player subtitle result:", detail);
                message(detail);
                if (results.every(res => !res.cues.length)) showToast("자막 연결 실패: MP3와 KO/EN VTT를 함께 선택하거나 GitHub 접근을 확인하세요.");
            }

            el.bundleFiles?.addEventListener('change', (e) => {

                e.target.value = '';
                if (files && files.length > 0) {
                    loadFiles(files).catch(err => message("자막 처리 오류: " + err.message));
                }
            });

            // ==========================================
            // Audio Playback & Loop
            // ==========================================
            function syncPlaybackState() {
                if (!el.mainAudio) return;
                const cur = el.mainAudio.currentTime;

                if (el.seekBar && !isNaN(el.mainAudio.duration)) {
                    el.seekBar.value = cur;
                }
                if (el.currentTimeDisplay) {
                    el.currentTimeDisplay.textContent = formatTime(cur);
                }

                if (state.isLoopActive && state.pointA !== null && state.pointB !== null && state.pointB > state.pointA) {
                    if (cur >= state.pointB) {
                        el.mainAudio.currentTime = state.pointA;
                    }
                }

                renderSubtitleForTime(cur);

            }

            function startRafLoop() {
                cancelAnimationFrame(state.rafId);
                const step = () => {
                    if (el.mainAudio && !el.mainAudio.paused && !el.mainAudio.ended) {
                        syncPlaybackState();
                        state.rafId = requestAnimationFrame(step);
                    }
                };
                state.rafId = requestAnimationFrame(step);
            }

            function stopRafLoop() {
                cancelAnimationFrame(state.rafId);
            }

            function togglePlayPause() {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 상단에서 MP3 오디오 파일을 열어주세요.');

                } else {

                }

                    if (el.btnToggleLoopActive) {
                        el.btnToggleLoopActive.textContent = '반복 상태: OFF';
                        el.btnToggleLoopActive.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 transition';
                    }
                }
            }

            el.btnSetA?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 오디오 파일을 열어주세요.');
                    return;
                }
                state.pointA = el.mainAudio.currentTime;
                if (state.pointB !== null && state.pointB > state.pointA) {
                    state.isLoopActive = true;
                }
                updateLoopUI();
                showToast(`Point A 설정: ${formatTime(state.pointA, true)}`);
            });

            el.btnSetB?.addEventListener('click', () => {
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('먼저 오디오 파일을 열어주세요.');
                    return;
                }
                const cur = el.mainAudio.currentTime;
                if (state.pointA === null) {
                    state.pointA = Math.max(0, cur - 3);
                }
                if (cur <= state.pointA) {
                    showToast('Point B는 Point A보다 뒤의 시간이어야 합니다.');
                    return;
                }
                state.pointB = cur;
                state.isLoopActive = true;
                updateLoopUI();
                showToast(`Point B 설정: ${formatTime(state.pointB, true)}`);
            });

            el.btnResetLoop?.addEventListener('click', () => {
                state.pointA = null;
                state.pointB = null;
                state.isLoopActive = false;
                updateLoopUI();
                showToast('A-B 구간이 초기화되었습니다.');
            });

            el.btnToggleLoopActive?.addEventListener('click', () => {
                if (state.pointA === null || state.pointB === null || state.pointB <= state.pointA) {
                    showToast('먼저 유효한 Point A와 Point B를 설정해주세요.');
                    return;
                }
                state.isLoopActive = !state.isLoopActive;
                updateLoopUI();
            });

            el.btnNudgeAMinus?.addEventListener('click', () => {
                if (state.pointA !== null) {
                    state.pointA = Math.max(0, state.pointA - 0.1);
                    updateLoopUI();
                }
            });
            el.btnNudgeAPlus?.addEventListener('click', () => {
                if (state.pointA !== null) {
                    state.pointA += 0.1;
                    updateLoopUI();
                }
            });
            el.btnNudgeBMinus?.addEventListener('click', () => {
                if (state.pointB !== null) {
                    state.pointB = Math.max((state.pointA || 0) + 0.1, state.pointB - 0.1);
                    updateLoopUI();
                }
            });
            el.btnNudgeBPlus?.addEventListener('click', () => {
                if (state.pointB !== null) {
                    const maxDur = el.mainAudio?.duration || Infinity;
                    state.pointB = Math.min(maxDur, state.pointB + 0.1);
                    updateLoopUI();
                }
            });

            // ==========================================
            // Playback Speed
            // ==========================================
            function setPlaybackSpeed(speedVal) {
                const speed = parseFloat(speedVal) || 1.0;
                if (el.mainAudio) el.mainAudio.playbackRate = speed;
                if (el.speedSlider) el.speedSlider.value = speed;

                const formatted = `${speed.toFixed(2).replace(/\.00$/, '.0')}x`;
                if (el.speedBadge) el.speedBadge.textContent = formatted;
                if (el.speedPanelDisplay) el.speedPanelDisplay.textContent = formatted;

                el.speedPresetBtns?.forEach(btn => {
                    const btnSpeed = parseFloat(btn.dataset.speed);
                    if (Math.abs(btnSpeed - speed) < 0.01) {
                        btn.className = 'speed-preset-btn py-1.5 rounded-xl bg-blue-600 text-white font-mono text-xs font-bold shadow-sm transition';
                    } else {
                        btn.className = 'speed-preset-btn py-1.5 rounded-xl bg-slate-100 hover:bg-blue-50 text-slate-700 font-mono text-xs font-semibold transition';
                    }
                });
            }

            el.speedSlider?.addEventListener('input', (e) => setPlaybackSpeed(e.target.value));
            el.speedPresetBtns?.forEach(btn => {
                btn.addEventListener('click', () => setPlaybackSpeed(btn.dataset.speed));
            });

            // ==========================================
            // Recording & Sequential Compare
            // ==========================================
            el.btnRecordToggle?.addEventListener('click', async () => {
                if (!state.isRecording) {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            showToast('이 브라우저에서는 마이크 녹음을 지원하지 않습니다.');
                            return;
                        }
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        state.audioChunks = [];

                        let options = { mimeType: 'audio/webm;codecs=opus' };
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                            options = { mimeType: 'audio/mp4' };
                            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                                options = {};
                            }
                        }

                        state.mediaRecorder = new MediaRecorder(stream, options);
                        state.recordedMime = state.mediaRecorder.mimeType || 'audio/webm';

                        state.mediaRecorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) {
                                state.audioChunks.push(e.data);
                            }
                        };

                        state.mediaRecorder.onstop = () => {
                            const blob = new Blob(state.audioChunks, { type: state.recordedMime });
                            if (state.recordedBlobUrl) {
                                URL.revokeObjectURL(state.recordedBlobUrl);
                            }
                            state.recordedBlobUrl = URL.createObjectURL(blob);
                            if (el.recordedAudio) {
                                el.recordedAudio.src = state.recordedBlobUrl;
                                el.recordedAudio.load();
                            }

                            if (el.btnPlayMyVoice) el.btnPlayMyVoice.disabled = false;
                            if (el.btnDownloadVoice) el.btnDownloadVoice.disabled = false;
                            if (el.btnSequentialCompare) el.btnSequentialCompare.disabled = false;

                            if (el.recStatusBadge) {
                                el.recStatusBadge.textContent = '녹음 완료';
                                el.recStatusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700';
                            }

                            stream.getTracks().forEach(track => track.stop());
                            showToast('음성 녹음이 완료되었습니다!');
                        };

                        state.mediaRecorder.start(250);
                        state.isRecording = true;

                        if (el.recBtnLabel) el.recBtnLabel.textContent = '녹음 중지';
                        el.btnRecordToggle?.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                        el.btnRecordToggle?.classList.add('bg-slate-800', 'hover:bg-slate-900', 'rec-active');

                        if (el.recStatusBadge) {
                            el.recStatusBadge.textContent = '녹음 중...';
                            el.recStatusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-600';
                        }
                    } catch (err) {
                        console.error('Microphone error:', err);
                        showToast('마이크 접근 권한이 거부되었거나 지원되지 않습니다.');
                    }
                } else {
                    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
                        state.mediaRecorder.stop();
                    }
                    state.isRecording = false;

                    if (el.recBtnLabel) el.recBtnLabel.textContent = '녹음 시작';
                    el.btnRecordToggle?.classList.remove('bg-slate-800', 'hover:bg-slate-900', 'rec-active');
                    el.btnRecordToggle?.classList.add('bg-rose-600', 'hover:bg-rose-700');
                }
            });

            el.btnPlayMyVoice?.addEventListener('click', () => {
                if (!el.recordedAudio || !el.recordedAudio.src) return;

                if (!el.recordedAudio.paused) {
                    el.recordedAudio.pause();
                    el.recordedAudio.currentTime = 0;
                    if (el.iconPlayVoice) el.iconPlayVoice.classList.remove('hidden');
                    if (el.iconStopVoice) el.iconStopVoice.classList.add('hidden');
                    if (el.playVoiceLabel) el.playVoiceLabel.textContent = '내 목소리 듣기';
                    showToast('녹음 재생이 중지되었습니다.');
                } else {
                    el.mainAudio?.pause();
                    el.recordedAudio.currentTime = 0;
                    el.recordedAudio.play().then(() => {
                        if (el.iconPlayVoice) el.iconPlayVoice.classList.add('hidden');
                        if (el.iconStopVoice) el.iconStopVoice.classList.remove('hidden');
                        if (el.playVoiceLabel) el.playVoiceLabel.textContent = '재생 중지';
                        showToast('녹음된 내 목소리를 재생합니다.');
                    }).catch(err => {
                        console.error('Playback error:', err);
                        showToast('녹음된 오디오 재생 중 오류가 발생했습니다.');
                    });
                }
            });

            el.recordedAudio?.addEventListener('ended', () => {
                if (el.iconPlayVoice) el.iconPlayVoice.classList.remove('hidden');
                if (el.iconStopVoice) el.iconStopVoice.classList.add('hidden');
                if (el.playVoiceLabel) el.playVoiceLabel.textContent = '내 목소리 듣기';
            });

            el.btnDownloadVoice?.addEventListener('click', () => {
                if (!state.recordedBlobUrl) return;
                const link = document.createElement("a");
                link.href = state.recordedBlobUrl;
                link.download = state.recordedMime.includes("mp4") ? "shadowing_recording.m4a" : "shadowing_recording.webm";
                link.click();
            });

            function waitUntil(audioElement, end, token) {
                return new Promise(resolve => {
                    function tick() {
                        if (token !== state.compareId || audioElement.paused || audioElement.ended || audioElement.currentTime >= end) {
                            resolve();
                        } else {
                            requestAnimationFrame(tick);
                        }
                    }
                    requestAnimationFrame(tick);
                });
            }

            el.btnSequentialCompare?.addEventListener('click', async () => {
                if (state.comparing) {
                    state.compareId++;
                    state.comparing = false;
                    if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "원어민 → 내 목소리 비교";
                    el.mainAudio?.pause();
                    el.recordedAudio?.pause();
                    return;
                }

                if (!state.recordedBlobUrl) {
                    showToast('먼저 음성을 녹음해주세요.');
                    return;
                }
                if (!el.mainAudio || !el.mainAudio.src) {
                    showToast('원어민 MP3 오디오 파일이 필요합니다.');
                    return;
                }

                let start = 0, end = 0;
                if (state.pointA !== null && state.pointB !== null && state.pointB > state.pointA) {
                    start = state.pointA;
                    end = state.pointB;
                } else {
                    const list = state.subtitles[state.currentLang] || [];
                    const cur = el.mainAudio.currentTime;
                    let active = list.find(c => cur >= c.start && cur < c.end);
                    if (active) {
                        start = active.start;
                        end = active.end;
                    } else {
                        start = Math.max(0, cur - 3);
                        end = Math.min(el.mainAudio.duration || start + 3, start + 3);
                    }
                }

                if (end <= start) {
                    showToast('비교할 구간이 없습니다.');
                    return;
                }

                const token = ++state.compareId;
                state.comparing = true;
                if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "■ 비교 중지";

                const prevLoop = state.isLoopActive;
                state.isLoopActive = false;

                el.mainAudio.pause();
                el.recordedAudio?.pause();
                el.mainAudio.currentTime = start;

                try {
                    await el.mainAudio.play();
                    await waitUntil(el.mainAudio, end, token);
                    el.mainAudio.pause();

                    if (token !== state.compareId) return;

                    if (el.recordedAudio) {
                        el.recordedAudio.currentTime = 0;
                        await el.recordedAudio.play();
                        showToast('원어민 구간 다음으로 내 목소리를 재생합니다.');
                    }
                } catch (err) {
                    console.error("Compare error:", err);
                } finally {
                    if (token === state.compareId) {
                        state.comparing = false;
                        state.isLoopActive = prevLoop;
                        if (el.btnSequentialCompare) el.btnSequentialCompare.textContent = "원어민 → 내 목소리 비교";
                    }
                }
            });

            // ==========================================
            // Keyboard Shortcuts
            // ==========================================
            document.addEventListener('keydown', (e) => {
                const tag = e.target?.tagName?.toUpperCase();
                if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) {
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    el.btnSkipBack?.click();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    el.btnSkipForward?.click();
                } else if (e.code === 'KeyA') {
                    e.preventDefault();
                    el.btnSetA?.click();
                } else if (e.code === 'KeyB') {
                    e.preventDefault();
                    el.btnSetB?.click();
                }
            });
        });
    </script>
</body>
</html>
