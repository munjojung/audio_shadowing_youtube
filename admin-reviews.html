<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review JSON 관리 | Shadowing Player Pro</title><style>body{font:16px system-ui;background:#f4f7fb;color:#182b42;margin:0}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border:1px solid #dae2ee;border-radius:12px;padding:22px}textarea{width:100%;box-sizing:border-box;height:360px;font:13px monospace}input{padding:10px}button{background:#1763c9;color:white;border:0;border-radius:7px;padding:10px 16px;margin:6px;cursor:pointer}pre{white-space:pre-wrap}a{color:#1763c9}</style></head><body><main><h1>Review JSON 관리</h1><p><a href="/admin.html">관리자 대시보드</a></p><section><p>콘텐츠 ID <input id="content" placeholder="11자리 콘텐츠 ID" maxlength="11"> <button id="list">버전 조회</button></p><p><input type="file" id="file" accept=".json,application/json"></p><textarea id="json" placeholder="Review JSON을 붙여넣거나 파일을 선택하세요."></textarea><p><button id="validate">JSON 검증</button><button id="draft">초안 저장</button><button id="publish">게시 버전 등록</button></p><pre id="result" role="status"></pre></section></main><script>
const el=id=>document.getElementById(id),out=t=>el('result').textContent=t;
function parsed(){const p=JSON.parse(el('json').value);if(p.contentId!==el('content').value.trim())throw Error('contentId가 입력한 ID와 다릅니다');if(p.schemaVersion!=='1.0'||!Array.isArray(p.questions)||!p.questions.length)throw Error('schemaVersion/questions 오류');for(const q of p.questions){if(q.type!=='multiple_choice'||!Array.isArray(q.options)||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error('문항 오류: '+q.id)}return p;}
async function api(method,query='',body){const r=await fetch('/api/admin-reviews'+query,{method,credentials:'same-origin',cache:'no-store',headers:{...(body?{'Content-Type':'application/json','X-Admin-Request':'1'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패 ('+r.status+')');return j;}
el('file').onchange=async()=>{const f=el('file').files[0];if(f){if(f.size>100000)throw Error('파일 크기는 100KB 이하만 허용');el('json').value=await f.text();try{const p=JSON.parse(el('json').value);el('content').value=p.contentId||'';}catch{}}};
el('validate').onclick=()=>{try{const p=parsed();out('기본 JSON 검증 통과 · '+p.questions.length+'문항 (저장 시 서버 추가 검증)');}catch(e){out(e.message)}};
el('list').onclick=async()=>{try{const j=await api('GET','?id='+encodeURIComponent(el('content').value.trim()));out(JSON.stringify(j.reviews.map(x=>({version:x.version,status:x.status,created_at:x.created_at})),null,2));}catch(e){out(e.message)}};
async function save(publish){try{const payload=parsed();if(publish&&!confirm('이 Review JSON을 게시할까요? 기존 게시 버전은 초안으로 전환됩니다.'))return;const j=await api('POST','',{contentId:payload.contentId,payload,publish});out('등록 완료: v'+j.version+' · '+j.status);}catch(e){out(e.message)}}
el('draft').onclick=()=>save(false);el('publish').onclick=()=>save(true);
</script></body></html>
