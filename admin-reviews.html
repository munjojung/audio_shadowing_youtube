<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review JSON 관리 | Shadowing Player Pro</title><style>body{font:16px system-ui;background:#f4f7fb;color:#182b42;margin:0}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border:1px solid #dae2ee;border-radius:12px;padding:22px}textarea{width:100%;box-sizing:border-box;height:360px;font:13px monospace}input,select{padding:10px;max-width:100%;box-sizing:border-box}select{min-width:min(100%,430px)}.hint{font-size:13px;color:#53657b}.selected{font-weight:600}button{background:#1763c9;color:white;border:0;border-radius:7px;padding:10px 16px;margin:6px;cursor:pointer}pre{white-space:pre-wrap}a{color:#1763c9}</style></head><body><main><h1>Review JSON 관리</h1><p><a href="/admin.html">관리자 대시보드</a></p><section><div class="auth"><label for="token">관리자 인증 토큰 (세션 인증이 되지 않을 때만 입력)</label> <input id="token" type="password" autocomplete="off" placeholder="관리자 토큰" style="width:min(100%,370px)"> <button id="login" type="button">토큰으로 인증</button> <button id="logout" type="button">토큰 해제</button><p class="hint">토큰은 이 페이지의 메모리에서만 사용하며 저장하지 않습니다. 관리자 세션이 유효하면 입력할 필요가 없습니다.</p></div><p>콘텐츠 선택 <select id="content" aria-label="등록된 콘텐츠 선택" disabled><option value="">콘텐츠 목록 불러오는 중...</option></select> <button id="reload" type="button">목록 새로고침</button> <button id="list" type="button">버전 조회</button><span class="hint" id="selected"></span></p><p><input type="file" id="file" accept=".json,application/json"></p><p class="hint">콘텐츠를 변경하면 이전 JSON 편집 내용이 지워집니다. 필요한 내용은 먼저 별도로 저장하세요.</p><textarea id="json" placeholder="Review JSON을 붙여넣거나 파일을 선택하세요."></textarea><p><button id="validate">JSON 검증</button><button id="draft">초안 저장</button><button id="publish">게시 버전 등록</button></p><pre id="result" role="status"></pre></section></main><script>
'use strict';
const el=id=>document.getElementById(id),out=t=>el('result').textContent=t;
let adminToken='';
let requestSerial=0;
function authError(e){return e.status===401||e.status===403;}
async function request(path,method='GET',body){
 const headers={...(adminToken?{Authorization:'Bearer '+adminToken}:{}),...(body!==undefined?{'Content-Type':'application/json','X-Admin-Request':'1'}:{})};
 const r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers,body:body!==undefined?JSON.stringify(body):undefined});
 const raw=await r.text();let j;
 try{j=JSON.parse(raw)}catch{throw Error('HTTP '+r.status+' · API 응답이 JSON이 아닙니다');}
 if(!r.ok){const e=Error(authError({status:r.status})?'관리자 인증이 필요합니다 (HTTP '+r.status+'). 관리자 로그인 후 새로고침하거나 위에서 관리자 토큰으로 인증하세요.':(j.error||'요청 실패')+' (HTTP '+r.status+')');e.status=r.status;throw e;}
 return j;
}
function parsed(){
 const id=el('content').value;
 if(!id)throw Error('콘텐츠를 먼저 선택하세요');
 const p=JSON.parse(el('json').value);
 if(p.contentId!==id)throw Error('JSON의 contentId가 선택한 콘텐츠 ID와 다릅니다');
 if(p.schemaVersion!=='1.0'||!Array.isArray(p.questions)||!p.questions.length)throw Error('schemaVersion/questions 오류');
 for(const q of p.questions){if(q.type!=='multiple_choice'||!Array.isArray(q.options)||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error('문항 오류: '+q.id);}
 return p;
}
function clearEditor(){el('json').value='';el('file').value='';out('콘텐츠가 변경되어 이전 JSON 입력을 지웠습니다. 새 JSON을 불러오거나 붙여넣으세요.');}
function updateSelected(){el('selected').textContent=el('content').value?'선택 ID: '+el('content').value:'';}
async function loadContents(preferredId){
 const serial=++requestSerial, select=el('content'), oldId=preferredId??select.value;
 select.disabled=true;select.replaceChildren(new Option('콘텐츠 목록 불러오는 중...',''));
 try{
  const j=await request('/api/admin-contents');
  if(serial!==requestSerial)return;
  const rows=Array.isArray(j)?j:(j.contents||j.items||j.data?.contents);
  if(!Array.isArray(rows))throw Error('콘텐츠 목록 API 응답 형식이 예상과 다릅니다');
  const items=rows.filter(c=>c&&typeof c.id==='string'&&c.id);
  select.replaceChildren(new Option('콘텐츠를 선택하세요',''));
  for(const c of items)select.add(new Option((c.title||'제목 없음')+' ('+c.id+')',c.id));
  select.disabled=!items.length;
  if(oldId&&items.some(c=>c.id===oldId))select.value=oldId;
  updateSelected();
  out(items.length?'콘텐츠 '+items.length+'건을 불러왔습니다.':'등록된 콘텐츠가 없습니다.');
 }catch(e){
  if(serial!==requestSerial)return;
  select.replaceChildren(new Option('목록 조회 실패 — 인증 확인',''));
  updateSelected();out('콘텐츠 목록 조회 오류: '+e.message);
 }
}
el('content').addEventListener('change',()=>{clearEditor();updateSelected();});
el('reload').onclick=()=>loadContents();
el('login').onclick=async()=>{
 const value=el('token').value.trim();if(!value){out('관리자 토큰을 입력하세요.');return;}
 adminToken=value;el('token').value='';
 await loadContents();
};
el('logout').onclick=()=>{adminToken='';el('token').value='';el('content').replaceChildren(new Option('로그아웃 — 인증 필요',''));el('content').disabled=true;clearEditor();out('페이지에 입력한 토큰을 해제했습니다.');};
el('file').onchange=async()=>{
 try{
  const f=el('file').files[0];if(!f)return;
  if(f.size>100000)throw Error('파일 크기는 100KB 이하만 허용');
  const value=await f.text(),p=JSON.parse(value);
  const id=el('content').value;
  if(!id)throw Error('콘텐츠를 먼저 선택하세요');
  if(p.contentId!==id)throw Error('파일의 contentId ('+p.contentId+')가 선택한 콘텐츠 ('+id+')와 다릅니다. 올바른 콘텐츠를 선택한 뒤 다시 불러오세요.');
  el('json').value=value;out('선택한 콘텐츠의 JSON 파일을 불러왔습니다.');
 }catch(e){el('file').value='';out('파일 읽기 오류: '+e.message);}
};
el('validate').onclick=()=>{try{const p=parsed();out('기본 JSON 검증 통과 · '+p.questions.length+'문항 (저장 시 서버 추가 검증)');}catch(e){out(e.message);}};
el('list').onclick=async()=>{
 try{
  const id=el('content').value;if(!id)throw Error('콘텐츠를 먼저 선택하세요');
  const j=await request('/api/admin-reviews?id='+encodeURIComponent(id));
  if(el('content').value!==id)return;
  const rows=Array.isArray(j.reviews)?j.reviews:[];
  out(rows.length?JSON.stringify(rows.map(x=>({version:x.version,status:x.status,created_at:x.created_at})),null,2):'선택한 콘텐츠에 등록된 Review JSON 버전이 없습니다.');
 }catch(e){out('버전 조회 오류: '+e.message);}
};
async function save(publish){
 try{
  const payload=parsed();
  if(publish&&!confirm('이 Review JSON을 게시할까요? 기존 게시 버전은 초안으로 전환됩니다.'))return;
  const j=await request('/api/admin-reviews','POST',{contentId:payload.contentId,payload,publish});
  out('등록 완료: v'+j.version+' · '+j.status);
 }catch(e){out('저장 오류: '+e.message);}
}
el('draft').onclick=()=>save(false);
el('publish').onclick=()=>save(true);
loadContents();
</script></body></html>
