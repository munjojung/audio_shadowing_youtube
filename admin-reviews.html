<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review JSON 관리 | Shadowing Player Pro</title><style>body{font:16px system-ui;background:#f4f7fb;color:#182b42;margin:0}main{max-width:900px;margin:30px auto;padding:20px}section{background:white;border:1px solid #dae2ee;border-radius:12px;padding:22px}textarea{width:100%;box-sizing:border-box;height:360px;font:13px monospace}input,select{padding:10px;max-width:100%;box-sizing:border-box}select{min-width:min(100%,430px)}.hint{font-size:13px;color:#53657b}.selected{font-weight:600}button{background:#1763c9;color:white;border:0;border-radius:7px;padding:10px 16px;margin:6px;cursor:pointer}pre{white-space:pre-wrap}a{color:#1763c9}</style></head><body><main><h1>Review JSON 관리</h1><p><a href="/admin.html">관리자 대시보드</a></p><section><p>콘텐츠 선택 <select id="content" aria-label="등록된 콘텐츠 선택" disabled><option value="">콘텐츠 목록 불러오는 중...</option></select> <button id="reload" type="button">목록 새로고침</button> <button id="list" type="button">버전 조회</button><span class="hint" id="selected"></span></p><p><input type="file" id="file" accept=".json,application/json"></p><textarea id="json" placeholder="Review JSON을 붙여넣거나 파일을 선택하세요."></textarea><p><button id="validate">JSON 검증</button><button id="draft">초안 저장</button><button id="publish">게시 버전 등록</button></p><pre id="result" role="status"></pre></section></main><script>
const el=id=>document.getElementById(id),out=t=>el('result').textContent=t;
function parsed(){const p=JSON.parse(el('json').value);if(!el('content').value)throw Error('콘텐츠를 먼저 선택하세요');if(p.contentId!==el('content').value)throw Error('JSON의 contentId가 선택한 콘텐츠 ID와 다릅니다');if(p.schemaVersion!=='1.0'||!Array.isArray(p.questions)||!p.questions.length)throw Error('schemaVersion/questions 오류');for(const q of p.questions){if(q.type!=='multiple_choice'||!Array.isArray(q.options)||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error('문항 오류: '+q.id)}return p;}
async function api(method,query='',body){const r=await fetch('/api/admin-reviews'+query,{method,credentials:'same-origin',cache:'no-store',headers:{...(body?{'Content-Type':'application/json','X-Admin-Request':'1'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패 ('+r.status+')');return j;}
async function loadContents(preferredId=''){
  const select=el('content'), previous=preferredId||select.value;
  select.disabled=true;
  select.replaceChildren(new Option('콘텐츠 목록 불러오는 중...', ''));
  try{
    const r=await fetch('/api/admin-contents',{credentials:'same-origin',cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw Error(j.error||'콘텐츠 조회 실패 ('+r.status+')');
    const rows=Array.isArray(j)?j:(j.contents||j.items||j.data?.contents);
    if(!Array.isArray(rows))throw Error('콘텐츠 API 응답 형식을 확인해야 합니다');
    const items=rows.filter(c=>c&&typeof c.id==='string'&&c.id.length);
    select.replaceChildren(new Option('콘텐츠를 선택하세요', ''));
    for(const c of items)select.add(new Option((c.title||'제목 없음')+' ('+c.id+')',c.id));
    select.disabled=!items.length;
    if(previous&&items.some(c=>c.id===previous))select.value=previous;
    updateSelected();
    if(!items.length)out('등록된 콘텐츠가 없습니다.');
    else if(previous&&!select.value)out('JSON의 콘텐츠 ID가 등록 목록에 없습니다: '+previous);
  }catch(e){
    select.replaceChildren(new Option('목록 조회 실패 — 새로고침', ''));
    updateSelected();out('콘텐츠 목록 조회 오류: '+e.message);
  }
}
function updateSelected(){el('selected').textContent=el('content').value?'선택 ID: '+el('content').value:'';}
el('content').onchange=updateSelected;
el('reload').onclick=()=>loadContents();
el('file').onchange=async()=>{
  try{
    const f=el('file').files[0];if(!f)return;
    if(f.size>100000)throw Error('파일 크기는 100KB 이하만 허용');
    el('json').value=await f.text();
    const p=JSON.parse(el('json').value);
    if(p.contentId&&Array.from(el('content').options).some(o=>o.value===p.contentId)){
      el('content').value=p.contentId;updateSelected();out('JSON 파일을 불러왔습니다. 콘텐츠를 확인하세요.');
    }else{out('JSON 파일을 불러왔습니다. 목록에서 일치하는 콘텐츠를 선택하세요.');}
  }catch(e){out('파일 읽기 오류: '+e.message);}
};
el('validate').onclick=()=>{try{const p=parsed();out('기본 JSON 검증 통과 · '+p.questions.length+'문항 (저장 시 서버 추가 검증)');}catch(e){out(e.message)}};
el('list').onclick=async()=>{try{if(!el('content').value)throw Error('콘텐츠를 먼저 선택하세요');const j=await api('GET','?id='+encodeURIComponent(el('content').value));out(JSON.stringify(j.reviews.map(x=>({version:x.version,status:x.status,created_at:x.created_at})),null,2));}catch(e){out(e.message)}};
async function save(publish){try{const payload=parsed();if(publish&&!confirm('이 Review JSON을 게시할까요? 기존 게시 버전은 초안으로 전환됩니다.'))return;const j=await api('POST','',{contentId:payload.contentId,payload,publish});out('등록 완료: v'+j.version+' · '+j.status);}catch(e){out(e.message)}}
el('draft').onclick=()=>save(false);el('publish').onclick=()=>save(true);
loadContents();
</script></body></html>
