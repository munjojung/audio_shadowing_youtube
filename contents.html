<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadowing Player Pro | 콘텐츠 선택</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17253e;background:#f5f7fb}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto}h1{font-size:25px;margin-bottom:6px}p{color:#64748b}ul{list-style:none;padding:0;display:grid;gap:12px}li a{display:block;background:white;border:1px solid #dbe4f0;border-radius:14px;padding:20px;text-decoration:none;color:#1e3a8a;font-weight:650}li a:hover,li a:focus{border-color:#2563eb;background:#eff6ff}small{display:block;color:#64748b;font-weight:400;margin-top:7px}#status{margin-top:20px}</style>
</head>
<body><main><h1>Shadowing Player Pro</h1><p>학습할 콘텐츠를 선택하세요. 기존 플레이어 화면으로 이동합니다.</p><ul id="items"></ul><p id="status" role="status">콘텐츠 목록을 불러오는 중…</p></main>
<script>
(async()=>{
 const items=document.getElementById('items');
 const status=document.getElementById('status');
 try{
  const response=await fetch('/api/contents',{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.contents))throw new Error('목록 형식 오류');
  for(const item of data.contents){
   if(typeof item.id!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(item.id)||typeof item.title!=='string')continue;
   const li=document.createElement('li');
   const a=document.createElement('a');
   a.href='/?content='+encodeURIComponent(item.id);
   a.textContent=item.title;
   const small=document.createElement('small');small.textContent='콘텐츠 ID: '+item.id;
   a.appendChild(small);li.appendChild(a);items.appendChild(li);
  }
  status.textContent=items.children.length?'총 '+items.children.length+'개 콘텐츠':'등록된 콘텐츠가 없습니다.';
 }catch(e){status.textContent='목록을 불러오지 못했습니다: '+e.message;}
})();
</script></body></html>
