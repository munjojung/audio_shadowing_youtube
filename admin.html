<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Shadowing Player Pro</title><style>body{margin:0;background:#f4f7fb;font:16px system-ui;color:#182b42}header{background:#152e50;color:white;padding:24px}main{max-width:860px;margin:30px auto;padding:0 16px}.panel{background:white;padding:25px;border-radius:14px;border:1px solid #dae2ee;margin-bottom:20px}input{padding:12px;width:100%;box-sizing:border-box;margin:12px 0}button,.link{display:inline-block;background:#1763c9;color:white;border:0;padding:12px 18px;border-radius:8px;text-decoration:none;cursor:pointer;margin:6px 5px 6px 0}.link{display:block;background:#edf3ff;color:#174e9b}.muted{color:#61748b}#menu{display:none}</style></head><body><header><h1>Shadowing Player Pro · Admin Dashboard</h1></header><main><section class="panel" id="loginPanel"><h2>관리자 인증</h2><p class="muted">ADMIN_API_TOKEN을 한 번 입력하세요. 브라우저 저장소에 토큰을 보관하지 않습니다.</p><input id="token" type="password" autocomplete="off" placeholder="관리자 토큰"><button id="login">로그인</button><p id="status" role="status"></p></section><section class="panel" id="menu"><h2>관리 메뉴</h2><a class="link" href="/admin-manager.html">콘텐츠 및 Study Guide 관리</a><a class="link" href="/admin-schedules.html">학습 일정 관리</a><a class="link" href="/admin-daily.html">일일 콘텐츠 관리</a><button id="logout">로그아웃</button></section></main><script>
const $=id=>document.getElementById(id);
async function check(){const r=await fetch('/api/admin-session',{cache:'no-store'});$('menu').style.display=r.ok?'block':'none';$('loginPanel').style.display=r.ok?'none':'block';}
$('login').onclick=async()=>{const token=$('token').value.trim();$('token').value='';try{const r=await fetch('/api/admin-session',{method:'POST',headers:{Authorization:'Bearer '+token,'X-Admin-Request':'1'},credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('로그인 실패 ('+r.status+')');await check();}catch(e){$('status').textContent=e.message;}};
$('logout').onclick=async()=>{await fetch('/api/admin-session',{method:'DELETE',headers:{'X-Admin-Request':'1'},credentials:'same-origin'});await check();};check();
</script></body></html>
