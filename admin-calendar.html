<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월간 학습 운영 | Shadowing Player Pro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182b42;font:15px system-ui}main{max-width:1120px;margin:24px auto;padding:0 14px}a{color:#1763c9}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #dae2ee;border-radius:14px;padding:20px;margin:16px 0}button{background:#1763c9;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;align-items:center;gap:12px;justify-content:center}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week{text-align:center;color:#61748b;margin:16px 0 8px}.day{min-height:93px;background:#f8fbff;border:1px solid #dce5f0;border-radius:10px;text-align:left;color:#182b42;padding:9px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}.day[aria-pressed="true"]{outline:3px solid #1763c9}.day .date{font-weight:700}.day .name{font-size:11px}.tag{font-size:11px;border-radius:5px;padding:3px 5px;background:#e8effa}.ok{background:#e0f4e9}.warn{background:#fff0d5}.empty{background:transparent;border:0}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.detail{background:#f5f8fd;padding:16px;border-radius:10px;overflow-wrap:anywhere}.muted{color:#61748b}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{background:#edf3ff;border-radius:7px;padding:9px;text-decoration:none}#status{min-height:20px}@media(max-width:650px){.day{min-height:72px;padding:5px}.day .name{display:none}.details{grid-template-columns:1fr}.panel{padding:12px}.calendar,.week{gap:3px}}
</style></head><body><main><header><div><h1>월간 학습 운영 달력</h1><p class="muted">학습 콘텐츠 · 전날 Review · 준비 상태</p></div><a href="/admin.html">관리자 대시보드</a></header><section class="panel"><div class="controls"><button id="prev" type="button" aria-label="이전 달">◀</button><h2 id="monthTitle"></h2><button id="next" type="button" aria-label="다음 달">▶</button></div><p id="status" role="status"></p><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div><p class="muted">초록: Review 게시 · 노랑: Review 미게시/초안 · 확정되지 않은 일정은 예상값입니다.</p></section><section class="panel"><h2 id="selectedTitle">날짜를 선택하세요</h2><div class="details"><div class="detail"><h3>오늘의 학습</h3><p id="learning"></p><p id="learningSource" class="muted"></p></div><div class="detail"><h3>어제의 Review</h3><p id="review"></p><p id="reviewSource" class="muted"></p></div></div><p class="actions"><a href="/admin-schedules.html">학습 일정 관리</a><a href="/admin-daily.html">일일 콘텐츠 관리</a><a href="/admin-reviews.html">Review 관리</a><a href="/admin-manager.html">콘텐츠 관리</a><a href="/admin.html#analyticsPanel">방문·학습 통계</a></p></section></main><script>
'use strict';const $=id=>document.getElementById(id);const seoul=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let current=seoul.slice(0,7),selected=seoul,days=[];const label={history:'확정',manual:'수동 지정',schedule:'일정 예상'};
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function detail(){const d=days.find(x=>x.date===selected);$('selectedTitle').textContent=selected+' 운영 상세';$('learning').textContent=d?.learning?.title||'배정된 학습 콘텐츠 없음';$('learningSource').textContent=d?.learning?(label[d.learning.source]||d.learning.source):'미배정';$('review').textContent=d?.review?d.review.title+' · '+(d.review.status==='published'?'게시 v'+d.review.version+' · '+d.review.questionCount+'문항':d.review.status==='draft'?'초안만 있음':'Review 없음'):'복습 대상 콘텐츠 없음';$('reviewSource').textContent=d?.review?'대상 학습일: '+d.review.learningDate+' · '+(label[d.review.source]||d.review.source):'';}
function render(){const [y,m]=current.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),count=new Date(Date.UTC(y,m,0)).getUTCDate(),root=$('calendar');$('monthTitle').textContent=y+'년 '+m+'월';root.replaceChildren();for(let i=0;i<first.getUTCDay();i++)root.append(node('div','empty'));for(let i=1;i<=count;i++){const date=current+'-'+String(i).padStart(2,'0'),d=days.find(x=>x.date===date),b=node('button','day');b.type='button';b.setAttribute('aria-pressed',String(date===selected));b.append(node('span','date',String(i)));if(d?.learning)b.append(node('span','name',d.learning.title));if(d?.review){const status=d.review.status;b.append(node('span','tag '+(status==='published'?'ok':'warn'),status==='published'?'Review 게시':status==='draft'?'Review 초안':'Review 없음'));}b.onclick=()=>{selected=date;render();detail();};root.append(b);}detail();}
async function load(){const month=current;$('status').textContent='월간 일정 조회 중...';try{const r=await fetch('/api/admin-calendar?month='+encodeURIComponent(month),{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);if(month!==current)return;days=j.days||[];if(!selected.startsWith(month))selected=month+'-01';$('status').textContent='확정 이력은 우선 적용하며, 미확정 일정은 현재 설정 기준으로 표시합니다.';render();}catch(e){days=[];$('calendar').replaceChildren();$('status').textContent='조회 실패: '+e.message+' · 관리자 로그인 상태를 확인하세요.';detail();}}
function shift(n){const [y,m]=current.split('-').map(Number),d=new Date(Date.UTC(y,m-1+n,1));current=d.toISOString().slice(0,7);selected=current+'-01';load();}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);load();
</script></body></html>
