<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 통계 | Shadowing Player Pro</title><style>body{font:16px system-ui;background:#f4f7fb;color:#182b42;margin:0}main{max-width:1050px;margin:24px auto;padding:18px}section{background:#fff;border:1px solid #dae2ee;border-radius:12px;padding:20px;margin:16px 0}h1{margin:0}button,select,input{padding:9px;border-radius:7px}button{background:#1763c9;color:white;border:0;cursor:pointer}a{color:#1763c9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#f1f6fc;padding:15px;border-radius:9px}.value{font-size:26px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #eee;padding:10px}th{font-size:13px}#error{color:#a92323;white-space:pre-wrap}.small{font-size:13px;color:#586a7d}</style></head><body><main><h1>학습 현황 통계</h1><p><a href="/admin.html">관리자 대시보드</a> · <a href="/admin-reviews.html">Review 관리</a></p><section><label>기간 <select id="days"><option value="7">최근 7일</option><option value="30">최근 30일</option><option value="90">최근 90일</option></select></label> <button id="refresh">새로고침</button><p class="small">관리자 세션이 없을 때만 관리자 API 토큰을 입력하세요. 토큰은 저장하지 않습니다.</p><input id="token" type="password" autocomplete="off" placeholder="관리자 API 토큰"> <button id="login">토큰 적용</button><p id="error" role="status"></p></section><section><h2>요약</h2><div id="summary" class="cards"></div></section><section><h2>콘텐츠별 학습</h2><div style="overflow:auto"><table><thead><tr><th>콘텐츠</th><th>세션</th><th>익명 방문자</th><th>학습 시간(분)</th><th>완료</th></tr></thead><tbody id="contents"></tbody></table></div></section><section><h2>Yesterday's Review</h2><div style="overflow:auto"><table><thead><tr><th>콘텐츠</th><th>제출</th><th>정답률</th></tr></thead><tbody id="reviews"></tbody></table></div></section></main><script>
'use strict';let token='';const el=id=>document.getElementById(id);const fmt=v=>Number(v||0).toLocaleString('ko-KR');function td(tr,value){const e=document.createElement('td');e.textContent=value;tr.append(e);}function table(id,rows,fields){const root=el(id);root.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const f of fields)td(tr,f(r));root.append(tr);}if(!rows.length){const tr=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=fields.length;cell.textContent='표시할 데이터가 없습니다.';tr.append(cell);root.append(tr);}}async function load(){el('error').textContent='';try{const r=await fetch('/api/admin-learning-stats?days='+el('days').value,{credentials:'same-origin',cache:'no-store',headers:token?{Authorization:'Bearer '+token}:{}}),j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);el('summary').replaceChildren();for(const [label,value] of [['접속 고유 클라이언트',fmt(j.summary.unique_clients)],['전체 페이지 접속',fmt(j.summary.page_views)],['신규 클라이언트',fmt(j.summary.new_clients)],['재방문 클라이언트',fmt(j.summary.returning_clients)],['학습 클라이언트',fmt(j.summary.visitors)],['학습 세션',fmt(j.summary.sessions)],['학습 시간(분)',fmt(Math.floor(Number(j.summary.active_seconds)/60))],['완료 세션',fmt(j.summary.completed_sessions)]]){const box=document.createElement('div');box.className='card';const a=document.createElement('div'),b=document.createElement('div');a.textContent=label;b.className='value';b.textContent=value;box.append(a,b);el('summary').append(box);}table('contents',j.contents,[r=>r.title||r.content_id,r=>fmt(r.sessions),r=>fmt(r.visitors),r=>fmt(Math.floor(Number(r.active_seconds)/60)),r=>fmt(r.completed)]);table('reviews',j.reviews,[r=>r.title||r.content_id,r=>fmt(r.attempts),r=>r.accuracy_percent===null?'—':r.accuracy_percent+'%']);}catch(e){el('error').textContent='조회 실패: '+e.message;}}el('refresh').onclick=load;el('days').onchange=load;el('login').onclick=()=>{token=el('token').value.trim();el('token').value='';load();};load();
</script></body></html>
