<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일일 추천 관리 | Shadowing Player Pro</title><style>
*{box-sizing:border-box}body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f3f6fb;color:#15243b;margin:0}main{max-width:880px;margin:28px auto;padding:0 16px}section{background:white;border:1px solid #dce4ef;border-radius:12px;padding:22px;margin:16px 0}h1{font-size:24px}h2{font-size:19px}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bdccdd;border-radius:6px;font:inherit}button{border:0;background:#1763c7;color:white;border-radius:6px;padding:10px 14px;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e6edf7;color:#183456}button:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:13px;color:#516681}.status{padding:12px;background:#edf3ff;border-radius:6px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.value{font-size:18px;font-weight:600}.danger{color:#aa2630}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<a href="/admin-schedules.html">← 학습 일정 관리</a><h1>날짜별 추천 · 확정 관리</h1>
<section><h2>관리자 인증</h2><label for="token">ADMIN_API_TOKEN (현재 탭 메모리에만 보관)</label><input id="token" type="password" autocomplete="off" placeholder="관리자 토큰"><button id="login">인증 및 조회</button><button id="logout" class="secondary">로그아웃</button><p id="message" class="status">토큰을 입력하고 인증해 주세요.</p></section>
<section><h2>날짜별 추천 조회</h2><div class="grid"><div><label for="date">학습 날짜 (한국시간)</label><input id="date" type="date"></div><div><label for="schedule">일정 ID</label><input id="schedule" type="number" min="1" value="1"></div></div><button id="load">추천 조회</button><p id="selection" class="status">조회 결과가 여기에 표시됩니다.</p></section>
<section><h2>수동 변경</h2><p class="hint">추천 확정 전 날짜만 변경할 수 있습니다. 변경 후 다시 조회하여 확인하세요.</p><label for="content">추천 콘텐츠</label><select id="content"><option value="">인증 후 목록 표시</option></select><label for="note">변경 사유 (선택)</label><textarea id="note" rows="2" placeholder="예: 특별 학습일"></textarea><button id="override">수동 지정 저장</button><button id="clear" class="secondary">수동 지정 해제</button></section>
<section><h2>추천 확정</h2><p class="hint">현재 날짜의 추천과 Published Study Guide 버전을 Neon 이력에 저장합니다. 확정 후에는 변경할 수 없습니다. 카카오톡 발송은 하지 않습니다.</p><button id="finalize">이 날짜 추천 확정</button></section>
</main><script>
(()=>{'use strict';let auth='';const $=id=>document.getElementById(id);const msg=(s,bad=false)=>{ $('message').textContent=s;$('message').className='status'+(bad?' danger':'');};
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});$('date').value=fmt.format(new Date());
const params=()=>({date:$('date').value,scheduleId:Number($('schedule').value)});
async function api(method,query,body){if(!auth)throw Error('먼저 관리자 인증을 하세요.');const r=await fetch('/api/admin-daily'+(query||''),{method,headers:{Authorization:'Bearer '+auth,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data;}
async function load(){const p=params();const data=await api('GET','?date='+encodeURIComponent(p.date)+'&scheduleId='+p.scheduleId);const s=data.selection;const text=s.content_id?`${s.title} (${s.content_id})`:'추천 없음';$('selection').textContent=`${data.date} · ${text}\n선정 방식: ${s.source}\n확정: ${s.finalized?'예':'아니오'}${s.guide_version!=null?'\nStudy Guide v'+s.guide_version:''}${s.note?'\n사유: '+s.note:''}`;
$('content').replaceChildren(new Option('콘텐츠 선택',''),...data.contents.map(c=>new Option(c.title+' ('+c.id+')',c.id)));if(s.content_id)$('content').value=s.content_id;['override','clear','finalize'].forEach(id=>$(id).disabled=!!s.finalized);return data;}
async function run(fn){try{await fn();}catch(e){msg(e.message,true);}}
$('login').onclick=()=>run(async()=>{auth=$('token').value.trim();$('token').value='';await load();msg('관리자 인증 및 조회 완료');});
$('logout').onclick=()=>{auth='';$('token').value='';$('selection').textContent='로그아웃되었습니다.';msg('로그아웃 완료');};
$('load').onclick=()=>run(async()=>{await load();msg('조회 완료');});
$('override').onclick=()=>run(async()=>{const p=params();if(!$('content').value)throw Error('콘텐츠를 선택하세요.');await api('POST','',{action:'override',date:p.date,contentId:$('content').value,note:$('note').value});await load();msg('수동 지정 저장 완료');});
$('clear').onclick=()=>run(async()=>{const p=params();if(!confirm(p.date+'의 수동 지정을 해제할까요?'))return;await api('POST','',{action:'clearOverride',date:p.date});await load();msg('수동 지정 해제 완료');});
$('finalize').onclick=()=>run(async()=>{const p=params();if(!confirm(p.date+'의 추천을 확정할까요? 확정 후 변경할 수 없습니다.'))return;const r=await api('POST','',{action:'finalize',...p});await load();msg('추천 확정 완료: '+r.title+' / Study Guide '+(r.guide_version==null?'없음':'v'+r.guide_version));});
})();
</script></body></html>
