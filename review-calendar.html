<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 복습 캘린더 | Shadowing Player Pro</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182b42;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:28px auto;padding:16px}h1{font-size:1.6rem}a{color:#1763c9}nav{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 22px}.panel{background:white;border:1px solid #dae2ee;border-radius:14px;padding:20px;margin-bottom:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h2{font-size:1.2rem;margin:0}button,.action{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:#1763c9;color:white;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9f1fc;color:#154a8b}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{margin-top:18px;color:#61748b;text-align:center;font-size:.85rem}.days{margin-top:8px}.day{min-height:96px;padding:8px 6px;background:#f2f5fa;color:#a1acba;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}.day.available{background:#f6f9ff;color:#123c76;cursor:pointer}.day.available:hover{background:#e6f1ff}.day-number{font-size:.86rem;font-weight:700}.day-title{font-size:.76rem;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-weight:500}.day-review{font-size:.68rem;padding:3px 5px;border-radius:5px;background:#dff4e8;color:#165c38;margin-top:auto;font-weight:600}.day-review.missing{background:#fff0d7;color:#825315}.day:disabled{cursor:default}.day.selected{outline:3px solid #1763c9;outline-offset:-3px}.day.today{border:1px dashed #8ba4c4}.muted{color:#61748b}#status{min-height:22px}#lesson[hidden],#questions[hidden]{display:none}.question{border-top:1px solid #e2e7ef;padding:15px 0}.question ol{padding-left:24px}.question li{padding:4px 0}.correct{font-weight:700;color:#136e43}.explain{color:#405772}#lesson h2{overflow-wrap:anywhere}@media(max-width:440px){.panel{padding:12px}.day{min-height:86px;padding:5px 3px;gap:4px}.day-title{font-size:.65rem;-webkit-line-clamp:3}.day-review{font-size:.58rem;padding:2px 3px}.toolbar button{padding:8px}}
 .heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.lang-switch{display:flex;gap:4px;padding:3px;border-radius:9px;background:#e9f1fc}.lang-btn{background:transparent;color:#154a8b;padding:7px 10px;font-size:.88rem}.lang-btn.active{background:#1763c9;color:#fff}.heading h1{margin:0} </style></head><body><main>
<div class="heading"><h1 data-i18n="heading">학습 복습 캘린더</h1><div class="lang-switch" role="group" aria-label="Language"><button type="button" id="langKo" class="lang-btn" aria-pressed="true">한국어</button><button type="button" id="langEn" class="lang-btn" aria-pressed="false">English</button></div></div>
<nav><a href="/review.html" data-i18n="backQuiz">10문제 복습으로 돌아가기</a><a href="/" data-i18n="player">쉐도잉 플레이어</a></nav>
<section class="panel"><div class="toolbar"><button id="prev" class="secondary" aria-label="이전 달" data-i18n-aria="prev">‹ <span data-i18n="prev">이전</span></button><h2 id="month"></h2><button id="next" class="secondary" aria-label="다음 달" data-i18n-aria="next"><span data-i18n="next">다음</span> ›</button></div>
<p class="muted" data-i18n="intro">확정된 과거 학습 콘텐츠의 제목과 Review 게시 상태를 표시합니다. 날짜를 선택해 MP3를 다시 듣거나 문제·정답을 확인하세요.</p>
<div class="week"><span data-week="0">일</span><span data-week="1">월</span><span data-week="2">화</span><span data-week="3">수</span><span data-week="4">목</span><span data-week="5">금</span><span data-week="6">토</span></div><div id="days" class="days" aria-label="학습 날짜 선택" data-i18n-aria="chooseDate"></div>
<p id="status" role="status" class="muted"></p></section>
<section class="panel" id="lesson" hidden><p id="dateLabel" class="muted"></p><h2 id="title"></h2><p><a id="listen" class="action" href="/"><span data-i18n="listen">MP3 다시 듣기 (KO/EN 자막)</span></a></p><div id="questions" hidden><h3 data-i18n="pastQuiz">지난 10문제 · 정답 및 해설 (읽기 전용)</h3><p class="muted" data-i18n="readOnly">현재 게시된 문제 버전을 표시합니다. 재채점하거나 점수를 저장하지 않습니다.</p><div id="questionList"></div></div><p id="noQuestions" class="muted"></p></section>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const I18N={
ko:{heading:'학습 복습 캘린더',backQuiz:'10문제 복습으로 돌아가기',player:'쉐도잉 플레이어',prev:'이전',next:'다음',intro:'확정된 과거 학습 콘텐츠의 제목과 Review 게시 상태를 표시합니다. 날짜를 선택해 MP3를 다시 듣거나 문제·정답을 확인하세요.',chooseDate:'학습 날짜 선택',listen:'MP3 다시 듣기 (KO/EN 자막)',pastQuiz:'지난 10문제 · 정답 및 해설 (읽기 전용)',readOnly:'현재 게시된 문제 버전을 표시합니다. 재채점하거나 점수를 저장하지 않습니다.',published:'Review 게시',missing:'Review 없음',noRecord:'기록 없음',untitled:'제목 없음',loading:'학습 기록을 불러오는 중...',loadingDay:'선택한 날짜의 자료를 불러오는 중...',count:n=>`${n}일의 학습 기록이 있습니다. 날짜를 선택해 MP3와 복습 자료를 확인하세요.`,empty:'확정된 과거 학습 기록이 없습니다.',noQuestions:'이 날짜에는 게시된 객관식 문제가 없습니다. MP3는 다시 들을 수 있습니다.',answer:'정답',answerMissing:'정답 정보 없음',explanation:'해설',fetchError:'데이터 조회 실패',week:['일','월','화','수','목','금','토'],month:(y,m)=>`${y}년 ${m}월`},
en:{heading:'Learning Review Calendar',backQuiz:'Back to 10-question quiz',player:'Shadowing Player',prev:'Previous',next:'Next',intro:'Browse confirmed past lessons and review availability. Select a date to listen again or view questions and answers.',chooseDate:'Choose a learning date',listen:'Listen to MP3 again (KO/EN subtitles)',pastQuiz:'Past 10 questions · Answers & explanations (read-only)',readOnly:'Shows the currently published question version. No regrading or score saving.',published:'Review published',missing:'No review',noRecord:'No lesson',untitled:'Untitled lesson',loading:'Loading learning history...',loadingDay:'Loading lesson details...',count:n=>`${n} day(s) of learning history. Select a date to listen or review.`,empty:'No confirmed past learning history.',noQuestions:'No published multiple-choice questions for this date yet. You can still listen to the MP3.',answer:'Answer',answerMissing:'Answer unavailable',explanation:'Explanation',fetchError:'Unable to load data',week:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],month:(y,m)=>new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1)))}
};
const getInitialLang=()=>{try{return localStorage.getItem('shadowing-review-calendar-lang')==='en'?'en':'ko';}catch{return 'ko';}};
let lang=getInitialLang();const tr=key=>I18N[lang][key];
function setLanguage(next){lang=next;document.documentElement.lang=lang;document.title=tr('heading')+' | Shadowing Player Pro';document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=tr(e.dataset.i18n);});document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.i18nAria)));document.querySelectorAll('[data-week]').forEach(e=>e.textContent=tr('week')[Number(e.dataset.week)]);['ko','en'].forEach(code=>{const b=document.getElementById(code==='ko'?'langKo':'langEn');b.classList.toggle('active',lang===code);b.setAttribute('aria-pressed',String(lang===code));});try{localStorage.setItem('shadowing-review-calendar-lang',lang);}catch{}render();if(selected&&available.has(selected)){select(selected);}else if(available.size){text('status',tr('count')(available.size));}else if(!document.getElementById('status').textContent.includes('HTTP')){text('status',tr('empty'));}}

const seoul=()=>{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t).value;return `${get('year')}-${get('month')}-${get('day')}`;};
const now=seoul();let month=now.slice(0,7);let available=new Map();let selected='';let request=0;
const text=(id,value)=>{$(id).textContent=value;};
const requestJson=async url=>{const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||tr('fetchError'));return j;};
const formatDate=(date)=>{const [y,m,d]=date.split('-').map(Number);return new Intl.DateTimeFormat(lang==='en'?'en-US':'ko-KR',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));};
const monthOffset=(m,offset)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(Date.UTC(y,mm-1+offset,1));return d.toISOString().slice(0,7);};
function render(){const [year,mon]=month.split('-').map(Number);text('month',tr('month')(year,mon));$('next').disabled=month>=now.slice(0,7);const root=$('days');root.replaceChildren();const [y,m]=month.split('-').map(Number);const offset=new Date(Date.UTC(y,m-1,1)).getUTCDay();const count=new Date(Date.UTC(y,m,0)).getUTCDate();for(let i=0;i<offset;i++){const blank=document.createElement('span');root.append(blank);}for(let d=1;d<=count;d++){const date=month+'-'+String(d).padStart(2,'0');const btn=document.createElement('button');btn.className='day'+(available.has(date)?' available':'')+(date===selected?' selected':'')+(date===now?' today':'');const number=document.createElement('span');number.className='day-number';number.textContent=d;btn.append(number);const item=available.get(date);btn.disabled=!item;btn.setAttribute('aria-label',item?`${date} ${item.title} ${item.has_review?tr('published'):tr('missing')}`:`${date} ${tr('noRecord')}`);if(item){const title=document.createElement('span');title.className='day-title';title.textContent=item.title||tr('untitled');btn.append(title);const status=document.createElement('span');status.className='day-review'+(item.has_review?'':' missing');status.textContent=item.has_review?tr('published'):tr('missing');btn.append(status);btn.onclick=()=>select(date);}root.append(btn);}}
async function loadMonth(){const token=++request;available=new Map();selected='';$('lesson').hidden=true;text('status',tr('loading'));render();try{const data=await requestJson('/api/review-calendar?month='+encodeURIComponent(month));if(token!==request)return;available=new Map(data.days.map(x=>[x.date,x]));text('status',available.size?tr('count')(available.size):tr('empty'));render();}catch(e){if(token===request)text('status',e.message);}}
async function select(date){selected=date;render();$('lesson').hidden=true;text('status',tr('loadingDay'));const token=request;try{const data=await requestJson('/api/review-calendar?date='+encodeURIComponent(date));if(token!==request||selected!==date)return;text('dateLabel',formatDate(date));text('title',data.title);$('listen').href='/?content='+encodeURIComponent(data.contentId);const list=$('questionList');list.replaceChildren();$('questions').hidden=!data.questions.length;text('noQuestions',data.questions.length?'':tr('noQuestions'));data.questions.forEach((q,i)=>{const article=document.createElement('article');article.className='question';const heading=document.createElement('h4');heading.textContent=`${i+1}. ${q.question}`;article.append(heading);const ol=document.createElement('ol');ol.type='A';q.options.forEach((option,k)=>{const li=document.createElement('li');li.textContent=option;if(k===q.answer)li.className='correct';ol.append(li);});article.append(ol);const answer=document.createElement('p');answer.className='correct';answer.textContent=Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length?`${tr('answer')}: ${String.fromCharCode(65+q.answer)}`:tr('answerMissing');article.append(answer);if(q.explanation){const explanation=document.createElement('p');explanation.className='explain';explanation.textContent=tr('explanation')+': '+q.explanation;article.append(explanation);}list.append(article);});$('lesson').hidden=false;text('status','');}catch(e){if(token===request)text('status',e.message);}}
$('langKo').onclick=()=>setLanguage('ko');$('langEn').onclick=()=>setLanguage('en');setLanguage(lang);
$('prev').onclick=()=>{month=monthOffset(month,-1);loadMonth();};$('next').onclick=()=>{if(month<now.slice(0,7)){month=monthOffset(month,1);loadMonth();}};loadMonth();
})();
</script></body></html>
