<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 복습 캘린더 | Shadowing Player Pro</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182b42;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:28px auto;padding:16px}h1{font-size:1.6rem}a{color:#1763c9}nav{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 22px}.panel{background:white;border:1px solid #dae2ee;border-radius:14px;padding:20px;margin-bottom:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h2{font-size:1.2rem;margin:0}button,.action{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:#1763c9;color:white;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9f1fc;color:#154a8b}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{margin-top:18px;color:#61748b;text-align:center;font-size:.85rem}.days{margin-top:8px}.day{min-height:55px;padding:6px 2px;background:#f2f5fa;color:#7b8999}.day.available{background:#e6f1ff;color:#123c76;font-weight:700}.day.selected{outline:3px solid #1763c9;outline-offset:-3px}.day.today{border:1px dashed #8ba4c4}.muted{color:#61748b}#status{min-height:22px}#lesson[hidden],#questions[hidden]{display:none}.question{border-top:1px solid #e2e7ef;padding:15px 0}.question ol{padding-left:24px}.question li{padding:4px 0}.correct{font-weight:700;color:#136e43}.explain{color:#405772}#lesson h2{overflow-wrap:anywhere}@media(max-width:440px){.panel{padding:12px}.day{min-height:44px}.toolbar button{padding:8px}}
</style></head><body><main>
<h1>학습 복습 캘린더</h1>
<nav><a href="/review.html">10문제 복습으로 돌아가기</a><a href="/">쉐도잉 플레이어</a></nav>
<section class="panel"><div class="toolbar"><button id="prev" class="secondary" aria-label="이전 달">‹ 이전</button><h2 id="month"></h2><button id="next" class="secondary" aria-label="다음 달">다음 ›</button></div>
<p class="muted">파란색 날짜는 확정된 과거 학습 콘텐츠입니다. 날짜를 선택해 다시 듣거나 문제·정답을 확인하세요.</p>
<div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="days" class="days" aria-label="학습 날짜 선택"></div>
<p id="status" role="status" class="muted"></p></section>
<section class="panel" id="lesson" hidden><p id="dateLabel" class="muted"></p><h2 id="title"></h2><p><a id="listen" class="action" href="/">MP3 다시 듣기 (KO/EN 자막)</a></p><div id="questions" hidden><h3>지난 10문제 · 정답 및 해설 (읽기 전용)</h3><p class="muted">현재 게시된 문제 버전을 표시합니다. 재채점하거나 점수를 저장하지 않습니다.</p><div id="questionList"></div></div><p id="noQuestions" class="muted"></p></section>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const seoul=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const now=seoul();let month=now.slice(0,7);let available=new Map();let selected='';let request=0;
const text=(id,value)=>{$(id).textContent=value;};
const requestJson=async url=>{const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'데이터 조회 실패');return j;};
const monthOffset=(m,offset)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(Date.UTC(y,mm-1+offset,1));return d.toISOString().slice(0,7);};
function render(){text('month',month.replace('-','년 ')+'월');$('next').disabled=month>=now.slice(0,7);const root=$('days');root.replaceChildren();const [y,m]=month.split('-').map(Number);const offset=new Date(Date.UTC(y,m-1,1)).getUTCDay();const count=new Date(Date.UTC(y,m,0)).getUTCDate();for(let i=0;i<offset;i++){const blank=document.createElement('span');root.append(blank);}for(let d=1;d<=count;d++){const date=month+'-'+String(d).padStart(2,'0');const btn=document.createElement('button');btn.className='day'+(available.has(date)?' available':'')+(date===selected?' selected':'')+(date===now?' today':'');btn.textContent=d;btn.disabled=!available.has(date);btn.setAttribute('aria-label',date+(available.has(date)?' 학습 콘텐츠':' 기록 없음'));if(available.has(date))btn.onclick=()=>select(date);root.append(btn);}}
async function loadMonth(){const token=++request;available=new Map();selected='';$('lesson').hidden=true;text('status','학습 기록을 불러오는 중...');render();try{const data=await requestJson('/api/review-calendar?month='+encodeURIComponent(month));if(token!==request)return;available=new Map(data.days.map(x=>[x.date,x]));text('status',available.size?`${available.size}일의 학습 기록이 있습니다.`:'확정된 과거 학습 기록이 없습니다.');render();}catch(e){if(token===request)text('status',e.message);}}
async function select(date){selected=date;render();$('lesson').hidden=true;text('status','선택한 날짜의 자료를 불러오는 중...');const token=request;try{const data=await requestJson('/api/review-calendar?date='+encodeURIComponent(date));if(token!==request||selected!==date)return;text('dateLabel',date);text('title',data.title);$('listen').href='/?content='+encodeURIComponent(data.contentId);const list=$('questionList');list.replaceChildren();$('questions').hidden=!data.questions.length;text('noQuestions',data.questions.length?'':'이 날짜의 공개된 객관식 문제는 아직 없습니다. MP3는 다시 들을 수 있습니다.');data.questions.forEach((q,i)=>{const article=document.createElement('article');article.className='question';const heading=document.createElement('h4');heading.textContent=`${i+1}. ${q.question}`;article.append(heading);const ol=document.createElement('ol');ol.type='A';q.options.forEach((option,k)=>{const li=document.createElement('li');li.textContent=option;if(k===q.answer)li.className='correct';ol.append(li);});article.append(ol);const answer=document.createElement('p');answer.className='correct';answer.textContent=Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length?`정답: ${String.fromCharCode(65+q.answer)}`:'정답 정보 없음';article.append(answer);if(q.explanation){const explanation=document.createElement('p');explanation.className='explain';explanation.textContent='해설: '+q.explanation;article.append(explanation);}list.append(article);});$('lesson').hidden=false;text('status','');}catch(e){if(token===request)text('status',e.message);}}
$('prev').onclick=()=>{month=monthOffset(month,-1);loadMonth();};$('next').onclick=()=>{if(month<now.slice(0,7)){month=monthOffset(month,1);loadMonth();}};loadMonth();
})();
</script></body></html>
